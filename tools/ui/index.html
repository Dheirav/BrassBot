<!doctype html>
<meta charset="utf-8">
<title>BrassBot</title>
<style>
  :root {
    /* Paper, not panel. This used to be a dark theme, and the reason to leave
       it is not taste: on a dark ground nothing separates from the background
       unless it carries some colour of its own, so every surface needed a tint
       and the colours that actually MEAN something (whose tile, which market,
       what is illegal) had to shout over all of it. On paper, plain grey
       separates, which leaves colour free to carry meaning and nothing else. */
    --bg:#e7dfcb;        /* the page, and the ground the board sits on */
    --panel:#f8f4ea;     /* the right rail */
    --panel2:#f3eee1;    /* the tray under the board */
    --raise:#e9e1cd;     /* a chip, a button, any unpressed surface */
    --raise2:#dbd1b6;    /* hover, and the row whose turn it is */
    --line:#cdc0a3;      /* every hairline */
    --line2:#b4a482;     /* a border meant to be seen, not merely felt */
    --ink3:#8b7d63;      /* third-rank ink: pips, quiet strokes, empty slots */
    --text:#2e2a21; --dim:#786c59;
    --dim2:#5c5344;      /* dim, but for figures rather than captions */
    --accent:#a9660f;    /* burnt amber: the one colour that means "yours" */
    --onaccent:#fdf8ec;  /* text ON the accent, which is now dark, not light */
    --badge:#fbf6ea;     /* the disc a number sits in, out on the board */
    --boardA:#f4eedd; --boardB:#e4d9c0;   /* the board's own paper gradient */
    --ok:#2f7d32; --warn:#8a5a00; --bad:#a52016;
    /* The industries, in the colours the physical tiles use. Every icon that
       stands for an INDUSTRY rather than for a player's tile is drawn in one of
       these, so the shape and the colour say the same thing and either one is
       enough. Darkened where the printed colour would not hold on cream, and
       the manufacturer blue is pushed towards indigo to stay clear of seat 0's
       cyan-blue -- iron and seat 1 are both orange by nature and that one is
       left alone, because iron's orange is also the iron market's. */
    --i-coal:#33312c; --i-iron:#c1521d; --i-brewery:#a67c0b;
    --i-cotton:#b3202a; --i-manuf:#2a4b8d; --i-pottery:#7a4a24;
    /* The map is height-bound: it is taller than it is wide, so every pixel
       the tray takes is a pixel off the map in BOTH directions. One variable,
       used by the tray and by the board column that is sized from what the
       tray leaves. */
    --sech:128px;        /* how tall the tray's own sections are */
    --trayh:var(--sech);  /* how much height the tray takes FROM the map */
    /* Okabe-Ito, the standard colourblind-safe set, with the sky blue swapped
       for its darker sibling: #56B4E9 was picked against a near-black ground
       and all but disappears on cream. Still separated in lightness as well as
       hue, so they survive greyscale. */
    --p0:#0072B2; --p1:#C24A00; --p2:#00795C; --p3:#B4508A;
  }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--text);
         font:14px/1.45 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
         display:grid;
         /* The board is TALLER than it is wide and the window is wider than it
            is tall, so the map is always height-bound and every pixel of the
            column beyond its own aspect ratio was empty paper. The middle
            column is sized to exactly what the map needs -- viewport height,
            less the tray, times the board's own ratio -- and the two rails
            divide what is left. minmax(0, ...) so a narrow window shrinks the
            map instead of overflowing the page. */
         grid-template-columns:
           minmax(214px, 286px)
           minmax(0, min(calc((100vh - var(--trayh) - 9px) * 1.0123 + 8px), 62vw))
           minmax(300px, 468px);
         grid-template-rows:minmax(0,1fr) auto; height:100vh;
         justify-content:center }
  #board { grid-column:2; grid-row:1; padding:4px; overflow:hidden; display:flex;
           position:relative }
  #preview { position:absolute; left:12px; right:12px; bottom:8px; padding:6px 10px;
             background:rgba(250,246,236,.96); border:1px solid var(--line);
             border-radius:8px; font-size:12px; pointer-events:none; display:none }
  #preview.on { display:block }
  #results { position:absolute; inset:12px; z-index:4; overflow:auto;
             background:rgba(248,244,234,.97); border:1px solid var(--line2);
             border-radius:10px; padding:18px 22px;
             box-shadow:0 12px 34px rgba(80,66,40,.28) }
  #results h1 { margin:0 0 2px; font-size:19px; letter-spacing:.02em }
  #results .sub { color:var(--dim); font-size:12px; margin-bottom:12px }
  #results table { border-collapse:collapse; width:100%; font-size:12.5px;
                   font-variant-numeric:tabular-nums lining-nums }
  #results th, #results td { padding:4px 8px; text-align:right;
                             border-bottom:1px solid var(--line) }
  #results th:first-child, #results td:first-child { text-align:left;
                             color:var(--dim); font-weight:400; white-space:nowrap }
  #results thead th { font-size:10.5px; letter-spacing:.08em; text-transform:uppercase;
                      border-bottom:2px solid var(--line2); vertical-align:bottom }
  #results thead th .dot { margin-right:5px }
  #results tr.total td { font-size:16px; font-weight:700; padding-top:8px;
                         padding-bottom:8px; color:var(--text) }
  #results tr.era td { font-weight:700; color:var(--text); padding-top:7px }
  #results tr.era td:first-child { text-transform:uppercase; font-size:10.5px;
                                   letter-spacing:.08em; color:var(--dim) }
  #results tr.part td { color:var(--dim2); font-size:12px; border-bottom:none }
  #results tr.part td:first-child { padding-left:22px }
  #results tr.sect td { border-bottom:none; padding-top:12px; font-size:10.5px;
                        letter-spacing:.08em; text-transform:uppercase;
                        color:var(--dim); font-weight:700 }
  #results td.me { background:rgba(169,102,15,.08) }
  #results th.me { border-bottom-color:var(--accent) }
  #results td.win, #results th.win { color:var(--accent) }
  #results .built { display:inline-flex; gap:7px; justify-content:flex-end;
                    flex-wrap:wrap }
  #results .built span { display:inline-flex; align-items:center; gap:2px }
  #results .built svg { vertical-align:-3px }
  #results .rk { font-size:10px; color:var(--dim); font-weight:400;
                 display:block; letter-spacing:0; text-transform:none }
  #results .amix { font-size:11px; color:var(--dim2); white-space:nowrap }
  #results .amix b { color:var(--text); font-weight:600 }
  #results button.close { position:absolute; top:12px; right:14px;
                          font-size:11.5px; padding:4px 9px }
  #zoom { position:absolute; left:42px; top:42px; display:flex; flex-direction:column;
          gap:4px }
  #zoom button { width:28px; height:26px; padding:0; font-size:13px; line-height:1;
                 background:rgba(250,246,236,.94) }
  #preview b { color:var(--accent) }
  #svg { width:100%; height:100%; display:block }
  /* The tray is the whole decision: your cards, what each one lets you do, and
     the choice that follows. Keeping it in one strip under the board means a
     turn is read left to right instead of hunted for in a sidebar. */
  #tray { grid-column:1 / span 2; grid-row:2; display:grid;
          box-shadow:0 -8px 20px rgba(80,66,40,.16);
          /* Browsing: the hand has the room. Once an action is chosen the
             options need it instead, so the columns trade width between them --
             the band never changes height and the board never moves. */
          grid-template-columns:minmax(0,2.6fr) 190px minmax(0,1fr);
          transition:grid-template-columns .16s ease;
          gap:1px; background:var(--line); border-top:1px solid var(--line) }
  #tray[data-mode="options"] { grid-template-columns:minmax(0,1.15fr) 190px minmax(0,2fr) }
  /* The map is taller than it is wide and the window is not, so the map is
     always height-bound: thinner rails free width it has no way to spend. The
     tray is the only thing competing for the height. Two ways to settle that.
     `bigmap` lifts the tray out of the grid and floats it over the board, so
     the map gets the whole window and the hand is still there, at the cost of
     covering the bottom of the board. `trayhid` then slides it away to a strip
     you can grab, for when the bottom is what you want to look at. */
  body { position:relative }
  body.bigmap { --trayh:0px }
  /* An absolutely positioned grid child is positioned against its GRID AREA,
     not the page. The tray's area is columns 1 and 2, the left rail plus the
     map, so right:0 is already the map's right edge and only the left offset
     has to be supplied -- and it is the rail's width, which CSS cannot read off
     a grid track, so JS sets --railL. Measuring against the page instead put
     the first four cards under the rail. */
  body.bigmap #tray { position:absolute; bottom:0; right:0; z-index:5;
                      left:var(--railL, 0px);
                      background:rgba(205,192,163,.55);
                      backdrop-filter:blur(7px);
                      box-shadow:0 -10px 26px rgba(80,66,40,.26);
                      transition:transform .18s ease }
  /* The rails paint over the floating tray, so it reads as belonging to the
     board rather than lying across the whole window. */
  body.bigmap #left, body.bigmap #right { position:relative; z-index:6 }
  body.bigmap.trayhid #tray { transform:translateY(calc(100% - 9px)) }
  body.bigmap.trayhid #tray:hover { transform:translateY(calc(100% - 22px)) }
  #tray > section { background:var(--panel2); padding:7px 10px 8px;
                    height:var(--sech); overflow:auto }
  .tbtn { font-size:9.5px; padding:2px 5px; margin-right:3px;
          text-transform:none; letter-spacing:0; white-space:nowrap }
  #tray h3 { margin:0 0 6px; font-size:10px; letter-spacing:1.1px;
             text-transform:uppercase; color:var(--dim); font-weight:700;
             display:flex; justify-content:space-between; align-items:center;
             flex-wrap:nowrap; white-space:nowrap; gap:6px }
  .acts { display:grid; grid-template-columns:1fr 1fr; gap:5px }
  .acts button { text-align:left; padding:3px 7px; font-size:11.5px }
  .acts button:disabled { opacity:.3; cursor:not-allowed; border-color:var(--line) }
  .acts button.sel { background:var(--accent); color:var(--onaccent) }
  .acts button small { color:inherit; opacity:.65; font-size:10px }
  .acts button { display:flex; align-items:baseline; gap:5px;
                 white-space:nowrap; overflow:hidden }
  .acts button small.why { font-size:9.5px; opacity:.8; color:var(--dim);
                           overflow:hidden; text-overflow:ellipsis }
  aside { background:var(--panel); overflow-y:auto; padding:14px }
  /* Left: what you consult -- the markets you will buy from, the piles you will
     build out of, what the marks mean. Right: what you track -- the score, the
     turn, what just happened. */
  #left  { grid-column:1; grid-row:1; border-right:1px solid var(--line);
           box-shadow:8px 0 20px rgba(80,66,40,.10) }
  #right { grid-column:3; grid-row:1 / span 2; border-left:1px solid var(--line);
           box-shadow:-8px 0 20px rgba(80,66,40,.16) }
  h2 { font-size:10px; text-transform:uppercase; letter-spacing:.11em;
       color:var(--dim); margin:16px 0 8px; font-weight:700;
       border-top:1px solid var(--line); padding-top:10px }
  h2:first-child { margin-top:0; border-top:none; padding-top:0 }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap }
  .chip { background:var(--raise); border:1px solid var(--line); border-radius:6px;
          padding:3px 8px; font-size:12px }
  .brand { display:flex; align-items:center; justify-content:space-between;
           gap:8px }
  .brand strong { font-size:16px; letter-spacing:.02em }
  .status { display:flex; align-items:baseline; justify-content:space-between;
            gap:6px 8px; margin:5px 0 0; flex-wrap:wrap }
  #era { font-size:12px; font-weight:700; letter-spacing:.06em;
         text-transform:uppercase; white-space:nowrap }
  #turn { font-size:11.5px; font-weight:700; white-space:nowrap;
          padding:3px 10px; border-radius:999px; color:var(--dim);
          background:var(--raise); border:1px solid var(--line) }
  /* Whose turn it is decides whether anything on the page is yours to change,
     so it is the one thing in the header allowed to use the accent. */
  #turn.mine { background:var(--accent); color:var(--onaccent);
               border-color:var(--accent) }
  .stats { display:flex; gap:15px; flex-wrap:wrap; margin:9px 0 0;
           padding:8px 0; border-top:1px solid var(--line) }
  .stat { display:flex; flex-direction:column; line-height:1.2 }
  .stat .k { font-size:9px; letter-spacing:.09em; text-transform:uppercase;
             color:var(--dim); font-weight:700 }
  .stat .v { font-size:13.5px; font-weight:700 }
  .stat .v small { font-size:10.5px; font-weight:400; color:var(--dim) }
  .onboard { font-size:11.5px; color:var(--dim); padding-bottom:9px;
             border-bottom:1px solid var(--line) }
  .onboard a { text-decoration:none; color:inherit }
  .tools { display:flex; gap:5px; flex-wrap:wrap; align-items:center;
           margin:9px 0 2px }
  .tools button { font-size:11.5px; padding:5px 8px }
  .seat { display:grid; grid-template-columns:1fr repeat(5, minmax(30px, auto));
          gap:2px 8px; padding:7px 9px; align-items:baseline;
          border-radius:6px; border:1px solid var(--line); margin-bottom:5px }
  .seat.me { border-color:var(--accent) }
  /* The columns were labelled once, in a caption above the table, which meant
     reading the fourth number required counting to four. Headers sit over the
     columns instead, on the same grid and with the same transparent border, or
     they drift a pixel out of line with the rows below. */
  .seathead { border-color:transparent; margin-bottom:2px; padding-bottom:2px;
              border-bottom:1px solid var(--line); border-radius:0;
              font-size:9.5px; letter-spacing:.06em; text-transform:uppercase;
              color:var(--dim); font-weight:700 }
  .seathead > span + span { text-align:right }
  .seat.turn { background:var(--raise) }
  .dot { width:9px; height:9px; border-radius:50%; display:inline-block;
         margin-right:6px; vertical-align:middle }
  button { font:inherit; background:var(--raise); color:var(--text);
           border:1px solid var(--line2); border-radius:6px; padding:6px 10px;
           cursor:pointer; transition:border-color .12s, background .12s }
  button:hover { border-color:var(--accent) }
  button.sel { background:var(--accent); color:var(--onaccent); border-color:var(--accent) }
  .move { display:block; width:100%; text-align:left; margin-bottom:4px;
          font-size:12.5px; white-space:normal }
  .empty { color:var(--dim); font-style:italic }
  text { font:600 10px ui-sans-serif,system-ui,sans-serif; fill:var(--text);
         pointer-events:none }
  .tname { font-size:10.5px; fill:var(--text); letter-spacing:.2px;
           paint-order:stroke fill; stroke:var(--boardA); stroke-width:3px;
           stroke-linejoin:round }
  text, .num, .mat, .seat { font-variant-numeric:tabular-nums lining-nums }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration:.01ms !important;
                             animation-duration:.01ms !important } }
  /* Decorative overlays. They are drawn ON TOP of the board, so without this
     a ghost sits under the cursor and swallows hovers and clicks aimed at the
     very target it is previewing. */
  #lay-fx, #lay-seat { pointer-events:none }
  .tgt { cursor:pointer }
  /* An SVG group takes focus but paints no useful outline, so the ring goes on
     the shape itself. */
  .tgt:focus { outline:none }
  .tgt:focus-visible rect { fill-opacity:0.30; stroke-width:3 }
  .tgt:focus-visible line { stroke-width:6 }
  .legendsum { font-size:10.5px; letter-spacing:.9px; text-transform:uppercase;
               color:var(--dim); font-weight:700; cursor:pointer; margin:4px 0 }
  #legend { display:grid; grid-template-columns:auto 1fr; gap:3px 8px;
            margin:4px 0 8px; align-items:center }
  .tgt:hover rect { fill-opacity:0.22 }
  #log div { font-size:12px; color:var(--dim); padding:2px 0;
             border-bottom:1px solid var(--line) }
  /* The mat is the thing a Brass player plans around -- you always build the
     LOWEST level you still hold -- and the first version of this UI did not
     show it at all. */
  .mat { display:grid; grid-template-columns:auto auto 1fr; gap:0;
         align-items:center; font-size:12.5px }
  .mat .ind { padding-right:10px }
  .mat .pile { padding-right:12px }
  /* One rule per industry, drawn across all three columns. Without it the eye
     has nothing to track along and reads figures off the wrong row. Marked by
     class rather than by nth-child, because an opened stack inserts a fourth
     child and every row after it would fall out of step. */
  .mat .mr { border-top:1px solid var(--line); padding-top:6px }
  .mat > span { padding-bottom:6px }
  .mat .ind { color:var(--dim) }
  .mat .mi { display:inline-flex; align-items:center; justify-content:center;
             width:23px; height:23px; border-radius:6px; margin-right:7px;
             vertical-align:-6px }
  .mat .lv { font-weight:600 }
  .meta { color:var(--dim); font-size:11px }
  .mat .meta { color:var(--dim2); font-size:11.5px; line-height:1.35 }
  .mat .meta b { color:var(--text); font-weight:700 }
  .mat .meta { text-align:right }
  /* The opened pile spans all three mat columns and indents under its row, so
     it reads as belonging to that industry rather than as another industry. */
  .stack { grid-column:1 / -1; display:grid; align-items:baseline;
           grid-template-columns:auto auto 1fr; gap:1px 6px;
           margin:1px 0 5px 14px; padding:4px 6px;
           border-left:2px solid var(--line2); background:var(--raise) }
  .stack .lv.nx { background:var(--accent); color:var(--onaccent) }
  .stackbtn { padding:0 3px; font-size:9px; line-height:1.4; margin-right:2px;
              background:none; border:none; color:var(--dim) }
  .pips { display:flex; gap:2px }
  .pip { width:7px; height:12px; border-radius:2px; background:var(--line) }
  .pip.have { background:var(--ink3) }
  .pip.next { background:var(--accent) }
  .warn { color:var(--accent) }
  .ok { color:var(--ok) }
  .gone { color:var(--bad) }
  .bar { height:6px; background:var(--line); border-radius:3px; overflow:hidden;
         min-width:70px; flex:1 }
  .bar > i { display:block; height:100%; background:var(--accent) }
  .ladder { display:flex; gap:2px; flex:1 }
  .slot { flex:1; height:13px; border-radius:2px; border:1px solid var(--line2) }
  .slot.full { background:var(--accent); border-color:var(--accent) }
  .slot.coal.full { background:#33312c; border-color:#33312c }
  .slot.iron.full { background:#c1521d; border-color:#c1521d }
  .sprice { flex:1; font-size:8px; color:var(--dim); text-align:left }
  .mkts { display:flex; gap:26px; justify-content:center; margin:8px 0 2px;
          align-items:flex-start }
  .mkt2 { text-align:center }
  .empt { display:inline-block; border:1px dashed var(--line2); border-radius:4px;
          padding:1px 9px; font-size:10.5px; color:var(--dim); margin-bottom:5px }
  .lad { display:grid; gap:3px; align-items:center; justify-content:center }
  .pr { font-size:10px; color:var(--dim); text-align:right; padding-right:3px }
  .cube { width:17px; height:15px; border-radius:2px;
          border:1px solid var(--line2); background:var(--panel) }
  .cube.coal.full { background:#33312c; border-color:#1e1d1a }
  .cube.iron.full { background:#c1521d; border-color:#8e3a12 }
  /* The cheapest cube still in the column is the one the next build pays for,
     which is the only space in either market anybody actually needs to find. */
  .cube.next { outline:2px solid var(--accent); outline-offset:1px }
  .mname { font-size:10.5px; font-weight:700; letter-spacing:.11em;
           text-transform:uppercase; margin-top:7px }
  .mcount { font-size:10px; color:var(--dim) }
  .seat small { color:var(--dim) }
  .move.hi { border-color:var(--accent) }
  .move:hover { border-color:var(--accent); background:var(--raise2) }
  .cost { display:block; font-size:10.5px; color:var(--dim); margin-top:2px }
  .rnd { font-size:9.5px; letter-spacing:.8px; text-transform:uppercase;
         color:var(--dim); border-bottom:1px solid var(--line);
         margin:7px 0 3px; padding-bottom:2px }
  .cost b { color:var(--text); font-weight:700 }
  /* Cards first. Brass is played by choosing a card and then seeing what it
     allows -- a flat list of 100 move strings is not a decision anyone can
     make. */
  /* The hand as the reference draws it: a two-column list of chips, so all
     eight are always on screen and readable, and the ONE selected card at full
     size beside it. Eight portrait cards in a row were the width problem and
     the readability problem at once. */
  .handwrap { display:flex; gap:12px; align-items:flex-start }
  .cards { display:grid; grid-template-columns:1fr 1fr; gap:2px 8px;
           flex:1 1 auto; min-width:0 }
  .hc { display:flex; align-items:center; gap:6px; height:21px; padding:0 8px 0 0;
          border:1px solid var(--ct, var(--line)); border-radius:6px;
          background:var(--cbg, var(--raise)); color:#2a2620; font-weight:700;
          font-size:12px; text-align:left; white-space:nowrap; overflow:hidden;
          cursor:grab; border-left-width:5px; min-width:0 }
  .hc svg { flex:none; margin-left:4px }
  .hc b { overflow:hidden; text-overflow:ellipsis; font-weight:700 }
  .hc.sel { box-shadow:0 0 0 2px var(--accent); background:var(--cbg, var(--raise));
            color:#2a2620; border-color:var(--ct, var(--line)) }
  .hc.dead { filter:grayscale(1); opacity:.5; cursor:not-allowed }
  .hc.drag { opacity:.35 }
  .hc.over { box-shadow:-3px 0 0 var(--accent) }
  #handsel { flex:none }
  #handsel:empty { display:none }
  /* The big card is browse-mode furniture; once options are open the hand
     column is narrow and the highlighted chip already says which card. */
  #tray[data-mode="options"] #handsel { display:none }
  /* Two columns even once options are open: the column is narrower but a
     chip truncates its name rather than the list dropping to eight rows that
     the tray cannot show. */
  #tray[data-mode="options"] .cards { gap:2px 5px }
  /* Three zones, as the reference draws them: kind at the top, an artwork panel
     with a tinted oval behind it, the name on a band at the foot. The face is
     light because a card is a physical object, and it sits on the dark tray the
     way a card sits on a table. */
  .card { width:69px; padding:0; overflow:hidden; cursor:grab;
          border-radius:9px; border:2px solid var(--ct, var(--dim));
          background:#fffdf6; color:#2a2620;
          box-shadow:0 1px 3px rgba(80,66,40,.22); text-align:center;
          display:flex; flex-direction:column }
  .card:hover { filter:brightness(1.05) }
  .card.sel { background:#fffdf6; color:#2a2620; border-color:var(--accent);
              box-shadow:0 0 0 3px var(--accent), 0 4px 10px rgba(80,66,40,.30);
              transform:translateY(-3px) }
  .card.dead { filter:grayscale(1); opacity:.55; cursor:not-allowed }
  .card.drag { opacity:.35 }

</style>
<div id="board">
  <svg id="svg" viewBox="-8 -6 826 816">
    <defs>
      <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="2.5"/></filter>
      <!-- One gradient per seat, referenced by every tile that seat owns. A
           flat fill reads as a coloured rectangle; a shaded one reads as an
           object on a surface, for the cost of a url() lookup. These live in
           <defs>, which the layer split made permanent. -->
      <linearGradient id="gp0" x1="0" y1="0" x2="0" y2="1">

<!-- Left is the game's own state and the controls over it: who and where, the

<aside id="left">
  <!-- Nine chips wrapping over five ragged rows is not a header, it is a pile.
       Three bands instead: who and where, then the counts that are numbers,

    <span>Inc</span><span>Link/card</span>
  </div>

  <div class="kinds" id="mattabs"></div><div class="mat" id="mat"></div>
  <h2>Recent <button id="logmode" onclick="toggleLog()"
      style="font-size:10px;padding:2px 6px">detail</button></h2>
  <div id="log"></div>
</aside>
<script>
const COL = ['var(--p0)','var(--p1)','var(--p2)','var(--p3)'];
const SHORT = {coal_mine:'CO', iron_works:'IR', brewery:'BR',
               cotton_mill:'CT', manufacturer:'MF', pottery:'PO'};
const NAME = {coal_mine:'coal mine', iron_works:'iron works', brewery:'brewery',
              cotton_mill:'cotton mill', manufacturer:'manufactured goods',
              pottery:'pottery'};

// Industry icons, drawn in a 24x24 box. Two-letter codes made the board a
// puzzle to read: CO/CT and MF/PO are one glyph apart, and nothing about "MF"
// suggests manufactured goods. A silhouette is recognisable at 14px where a
// pair of letters is not.
const ICON = {
  // a townhouse, for location cards -- the other half of the deck had no mark
  city: 'M4 20 v-9 l8 -6 l8 6 v9 z M10 20 v-5 h4 v5',
  // crossed arrows, for a wild card: it stands for any of them
  wild: 'M4 4 L20 20 M20 4 L4 20 M12 3 v18 M3 12 h18',
  // a cut face of coal
  coal_mine: 'M4 17 L8 7 L15 5 L21 11 L19 19 L9 20 Z',
  // an anvil
  iron_works: 'M3 9 h7 l2 2 h9 v3 q-4 0 -6 3 l-1 3 h-6 l1 -3 q-3 -2 -6 -2 z',
  // a barrel, on its side, with hoops
  brewery: 'M5 6 q7 -2 14 0 q2 6 0 12 q-7 2 -14 0 q-2 -6 0 -12 z '
         + 'M9 5 v14 M15 5 v14',
  // a bobbin of thread
  cotton_mill: 'M6 4 h12 v2 h-3 v12 h3 v2 h-12 v-2 h3 v-12 h-3 z '
             + 'M9 8 h6 M9 12 h6 M9 16 h6',
  // a gear
  manufacturer: 'M12 4 l2 0 l1 2.5 l2 1 l2.5 -1 l1.4 1.4 l-1 2.5 l1 2 l2.5 1 '
              + 'l0 2 l-2.5 1 l-1 2 l1 2.5 l-1.4 1.4 l-2.5 -1 l-2 1 l-1 2.5 '
              + 'l-2 0 l-1 -2.5 l-2 -1 l-2.5 1 l-1.4 -1.4 l1 -2.5 l-1 -2 '
              + 'l-2.5 -1 l0 -2 l2.5 -1 l1 -2 l-1 -2.5 l1.4 -1.4 l2.5 1 '
              + 'l2 -1 z M12 9 a3 3 0 1 0 0.1 0 z',
  // a vase
  pottery: 'M9 3 h6 v2 l-1 2 q4 3 4 7 q0 5 -6 7 q-6 -2 -6 -7 q0 -4 4 -7 l-1 -2 z',
};

const ICOL = {coal_mine:'var(--i-coal)', iron_works:'var(--i-iron)',
              brewery:'var(--i-brewery)', cotton_mill:'var(--i-cotton)',
              manufacturer:'var(--i-manuf)', pottery:'var(--i-pottery)'};
// A card face in its industry's colours: border, art panel, name band. Town and
// wild cards have no industry and keep the hashed hue that separates them from
// each other.
const CARDTINT = {
  coal_mine:    ['#4a473f', '#e9e6dc', '#dbd7c9'],
  iron_works:   ['#b34d1b', '#fae5d5', '#f2d5bf'],
  brewery:      ['#9a730a', '#f8ecc7', '#eedfad'],
  cotton_mill:  ['#a91f28', '#fbdcdd', '#f4c7c9'],
  manufacturer: ['#2a4b8d', '#dde4f5', '#c7d3ed'],
  pottery:      ['#74461f', '#f0e1d3', '#e4d1bc'],
};
// stroke-width 1.6 rather than 1.1: these are read at 12 to 17 pixels, where a
// hairline outline disappears into the fill and the silhouette goes soft. The
// optional halo draws the same path underneath as a fat light stroke, which is
// what lets an icon sit on a coloured tile or a patterned ground and still read.
function icon(ind, x, y, size, fill, opacity, halo) {
  const s = size / 24, o = opacity == null ? 1 : opacity;
  const path = `<path d="${ICON[ind]}"/>`;
  return `<g transform="translate(${x},${y}) scale(${s})" pointer-events="none">${
    halo ? `<g fill="none" stroke="${halo}" stroke-width="5"
             stroke-linejoin="round" stroke-linecap="round"
             opacity="0.8">${path}</g>` : ''}
    <g fill="${fill}" fill-opacity="${o}" stroke="${fill}"
       stroke-opacity="${o}" stroke-width="1.6"
       stroke-linejoin="round">${path}</g></g>`;
}
let S = null, card = null, kind = null, matSeat = 0, focus = null;
let logProse = false, resFilter = null, dev1 = null, dev2 = null;
let sc1 = null, sc2 = null;
// Which industry a Build is narrowed to. A wild location card can build every
// industry you hold at every town in reach, which is forty buttons and a map
// lit end to end; picking the industry first turns that into one question.
let bind = null;
// Which industries have their pile opened on the mat, by industry id.
let matOpen = {};
// Shared by draw() and renderKind(), which are separate top-level functions.
// TOWNNAME was caught living inside draw() by the Sell renderer, and cardLabel
// by the Scout renderer -- anything both use belongs out here.
let TOWNNAME = {};
// Identity of a card, so two copies of the same one are treated as the same
// card -- which is what they are.
const sigAt = i => (S && S.hand && S.hand[i]) ? cardSig(S.hand[i]) : `#${i}`;
// "Stoke-on-Trent" over two lines is a different shape from every other card
// and breaks the row. The reference abbreviates; so does this.
// TOWNSHORT, not SHORT: that name was already taken by the industry
// abbreviations above, and the collision silently blanked the whole page.
const TOWNSHORT = {birmingham: "B'ham", worcester: 'Worc.', wolverhampton: 'Wolver.',
                   coalbrookdale: 'Coalbr.', kidderminster: 'Kidder.',
                   stoke_on_trent: 'Stoke', burton_on_trent: 'Burton',
                   farm_northern: 'Farm N', farm_southern: 'Farm S'};
const cardLabel = c => c.town
  ? (TOWNSHORT[c.town] || TOWNNAME[c.town] || c.town.replace(/_/g, ' '))
  : (c.industries && c.industries.length
     ? c.industries.map(i => MATNAME[i] || i).join(' / ')
     : c.kind.replace(/_/g, ' '));
const MATNAME = {coal_mine:'coal', iron_works:'iron', brewery:'brewery',
                 cotton_mill:'cotton', manufacturer:'manuf.', pottery:'pottery'};

// Every request carries the snapshot version its indices were drawn from, so
// a click made against a board that has since moved is refused rather than
// applied to a different action. Failures have to be visible: a silent catch
// leaves "Playing..." on screen forever.
// The room this tab is playing. The plain URL is "main"; ?room=anything is a
// separate table with its own board, so several people can play at once.
const ROOM = (new URLSearchParams(location.search).get('room') || 'main')
  .toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 12) || 'main';

const post = (url, body) => fetch(url, {method:'POST',
  headers:{'Content-Type':'application/json'},
  body:JSON.stringify({...(body||{}), room: ROOM,
                       version: S ? S.version : -1})})
  .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
  .then(s => { draw(s); if (s.stale) note('the board moved — that move was not played'); })
  .catch(e => note('request failed: ' + e.message));

function note(msg) {
  const box = document.getElementById('details');
  if (box) box.innerHTML = `<p class="gone">${msg}</p>` + box.innerHTML;
}

// The VP track is printed around the edge of the real board, and putting it
// anywhere else turns a score into a number you look up instead of a position
// you can see. 0 sits at the bottom-left corner; the track runs UP the left
// edge to 21, along the top to 50, DOWN the right to 71, and back along the
// bottom to 99, which is the loop the physical board uses.
const BOARD = {x0: 28, y0: 30, x1: 782, y1: 774};
const BAND = 17;    // the track's centre line, this far outside the board edge
const MARGIN = 36;  // the viewBox edge, this far outside the board edge
const BW = BOARD.x1 - BOARD.x0, BH = BOARD.y1 - BOARD.y0;
const TRACK = (() => {
  const {x0, y0, x1, y1} = BOARD, out = [];
  for (let i = 0; i < 22; i++)
    out.push({x: x0 - BAND, y: y1 - (i + .5) * BH / 22, e: 'l'});
  for (let i = 0; i < 29; i++)
    out.push({x: x0 + (i + .5) * BW / 29, y: y0 - BAND, e: 't'});
  for (let i = 0; i < 21; i++)
    out.push({x: x1 + BAND, y: y0 + (i + .5) * BH / 21, e: 'r'});
  for (let i = 0; i < 28; i++)
    out.push({x: x1 - (i + .5) * BW / 28, y: y1 + BAND, e: 'b'});
  return out;
})();
const INWARD = {l: [1, 0], t: [0, 1], r: [-1, 0], b: [0, -1]};

function trackFrame(s) {
  let g = `<rect x="${BOARD.x0 - MARGIN + 4}" y="${BOARD.y0 - MARGIN + 4}"
            width="${BW + 2 * MARGIN - 8}" height="${BH + 2 * MARGIN - 8}" rx="7"
            fill="#dbcfb2" stroke="var(--line2)"/>
           <rect x="${BOARD.x0 - 2}" y="${BOARD.y0 - 2}"
            width="${BW + 4}" height="${BH + 4}" rx="4"
            fill="var(--boardA)" stroke="var(--line2)"/>`;
  // A divider between every pair of adjacent spaces, so the numbers read as a
  // track with 100 cells rather than as a ring of loose figures.
  for (let v = 0; v < 99; v++) {
    const a = TRACK[v], b = TRACK[v + 1];
    if (a.e !== b.e) continue;
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    g += (a.e === 'l' || a.e === 'r')
      ? `<path d="M${mx - 14} ${my} h28" stroke="var(--line)" stroke-width=".7"/>`
      : `<path d="M${mx} ${my - 14} v28" stroke="var(--line)" stroke-width=".7"/>`;
  }
  for (let v = 0; v < 100; v++) {
    const t = TRACK[v], major = v % 10 === 0;
    g += `<text x="${t.x}" y="${t.y + 3.4}" text-anchor="middle"
           style="font-size:${major ? 10 : 8.5}px;
                  font-weight:${major ? 700 : 500};
                  fill:${major ? 'var(--text)' : 'var(--dim)'}">${v}</text>`;
  }
  // Two marks per seat. The solid disc is VP actually banked, which is what a
  // physical marker shows; the dashed ring is where the seat would finish if
  // the game ended now. Banked VP is near zero for everyone until the Canal
  // Era scores, so for the first half of the game the ring is the only one
  // that moves, and it is the one worth reading.
  const seen = {};
  const mark = (v, seat, solid) => {
    const i = ((Math.round(v) % 100) + 100) % 100, t = TRACK[i];
    const n = (seen[i] = (seen[i] || 0) + 1) - 1;
    const [ix, iy] = INWARD[t.e];
    const x = t.x + ix * n * 9, y = t.y + iy * n * 9;
    return solid
      ? `<circle cx="${x}" cy="${y}" r="6.5" fill="${COL[seat]}"
          stroke="var(--badge)" stroke-width="1.5"
          ><title>${seat === s.seat ? 'you' : 'Bot ' + seat}: ${v} VP banked</title></circle>`
      : `<circle cx="${x}" cy="${y}" r="6.5" fill="var(--badge)" fill-opacity="0.9"
          stroke="${COL[seat]}" stroke-width="2" stroke-dasharray="3 2"
          ><title>${seat === s.seat ? 'you' : 'Bot ' + seat}: ${v} VP projected, `
        + `if the game ended now</title></circle>`;
  };
  // Rings first: where a disc and a ring land on the same space, the banked
  // figure is the one that has actually happened, so it sits on top.
  for (const p of s.players) g += mark(p.projected, p.idx, false);
  for (const p of s.players) g += mark(p.vp, p.idx, true);
  return g;
}

function draw(s) {
  S = s;
  const C = s.coords, svg = document.getElementById('svg');
  let out = trackFrame(s)
          + `<rect x="${BOARD.x0}" y="${BOARD.y0}" width="${BW}" height="${BH}"
              fill="url(#gboard)"/>`;

  // Where the chosen card and action can actually land. Brass is played on the
  // map, so once you have said "Build" the question is WHERE -- and answering
  // that from a list of 57 sentences is a different game from pointing at the
  // town. These drive the highlights below and the clicks that follow.
  let selMoves = (card === null || kind === null) ? []
      : s.moves.filter(m => sigAt(m.card) === sigAt(card) && m.kind === kind);
  // With several industries on offer and one chosen, the board shows only
  // that one's towns. If the choice has become impossible (the card changed
  // under it), it is dropped rather than left pointing at nothing.
  if (kind === 'Build' && bind !== null) {
    if (selMoves.some(m => m.industry === bind))
      selMoves = selMoves.filter(m => m.industry === bind);
    else bind = null;
  }
  const tgtTown = {}, tgtLine = {};
  // SVG paints in document order, so anything drawn after a target would sit on
  // top of it and swallow the click. Targets are collected here and appended
  // last, as their own layer.
  let tgt = '';
  for (const m of selMoves) {
    if (m.kind === 'Build' && m.town) (tgtTown[m.town] = tgtTown[m.town] || []).push(m);
    else if (m.kind === 'Sell')
      (m.sales || []).forEach(sa => (tgtTown[sa.town] = tgtTown[sa.town] || []).push(m));
    else if (m.kind === 'Network')
      (m.lines || []).forEach(l => (tgtLine[l] = tgtLine[l] || []).push(m));
  }

  // links: every line on the board, built ones in their owner's colour
  const built = {};
  s.links.forEach(l => built[l.id] = l.owner);
  // A link is not always a line between two points: kidderminster-worcester
  // -farm_southern joins three locations, so draw spokes from the centroid.
  const spokes = (ends, stroke, w, dash) => {
    const cx = ends.reduce((a,e)=>a+C[e][0],0)/ends.length;
    const cy = ends.reduce((a,e)=>a+C[e][1],0)/ends.length;
    return ends.map(e => `<line x1="${C[e][0]}" y1="${C[e][1]}" x2="${cx}" y2="${cy}"
      stroke="${stroke}" stroke-width="${w}" stroke-linecap="round"
      ${dash ? 'stroke-dasharray="5 5"' : ''}/>`).join('');
  };
  for (const l of (s.all_links || []))
    if (!(l.id in built)) {
      const usable = s.era === 'canal' ? l.canal : l.rail;
      out += spokes(l.ends, usable ? 'var(--line2)' : 'var(--line)', usable ? 2 : 1.2,
                    s.era === 'canal');
    }
  for (const l of s.links) out += spokes(l.ends, COL[l.owner], 4, false);
  // Picking a double rail by browsing 240 pairs is not a decision anyone can
  // make. Once a first line is chosen, the map keeps only that line and the
  // ones it can pair with, and the second click plays the pair. Clicking the
  // chosen line again lets go of it.
  const first = (kind === 'Network' && focus && tgtLine[focus]) ? focus : null;
  if (first) {
    const partners = {};
    for (const m of tgtLine[first])
      for (const l of (m.lines || [])) if (l !== first) partners[l] = 1;
    for (const l in tgtLine) if (l !== first && !partners[l]) delete tgtLine[l];
  }
  // A line you could build right now, with a fat invisible hit area over it.
  for (const id in tgtLine) {
    const l = (s.all_links || []).find(x => x.id === id);
    if (!l) continue;
    const chosen = id === first;
    tgt += `<g class="tgt" data-act="line" data-id="${id}"
             tabindex="0" role="button"
             aria-label="${chosen ? 'let go of' : 'build the link at'} ${id.replace(/[-_]/g, ' ')}">
              ${chosen ? spokes(l.ends, 'var(--badge)', 9, false) : ''}
              ${spokes(l.ends, 'var(--accent)', chosen ? 5.5 : 3.5, false)}
              ${spokes(l.ends, 'transparent', 16, false)}
              <title>${chosen ? 'your first link — click again to let go'
                              : first ? 'pair with ' + first.replace(/[-_]/g, ' ')
                                      : 'build this link'}</title></g>`;
  }

  // What each line is worth at this instant. Link VP is the icons showing at
  // both ends and counts every player's tiles, not just yours -- so these
  // numbers climb as the board fills, which is why a link bought early scores
  // against a bare board. Zeroes are drawn too, dimmed: an unlabelled line is
  // ambiguous -- worth nothing, or the UI simply did not say?
  for (const l of (s.all_links || [])) {
    const cx = l.ends.reduce((a,e)=>a+C[e][0],0)/l.ends.length;
    const cy = l.ends.reduce((a,e)=>a+C[e][1],0)/l.ends.length;
    // These were the loudest marks on the board and the least urgent thing
    // on it. Full strength only while a link is actually being chosen.
    const loud = kind === 'Network';
    const zero = !l.vp;
    out += `<circle cx="${cx}" cy="${cy}" r="${loud ? 8.5 : 6.5}"
             fill="var(--badge)" fill-opacity="${zero ? 0.85 : loud ? 1 : 0.6}"
             stroke="${l.id in built ? COL[built[l.id]] : 'var(--line2)'}"
             stroke-width="1" stroke-opacity="${zero ? 0.35 : loud ? 1 : 0.6}"/>
            <text x="${cx}" y="${cy + (loud ? 3.5 : 2.8)}" text-anchor="middle"
             style="font-size:${loud ? 9 : 7.5}px;font-weight:700;
                    fill:${zero ? 'var(--dim)' : 'var(--accent)'};
                    opacity:${zero ? 0.5 : loud ? 1 : 0.55}"
             ><title>this link scores ${l.vp} VP if the era ended now</title
             >${l.vp}</text>`;
  }

  // merchants
  // Known before the merchants draw, so they recede with everything else.
  // Only TOWN targeting dims the towns: a link is worth the icons on the tiles
  // at both of its ends, so dimming those while you choose a link hides the
  // one thing the choice depends on.
  const narrowing = Object.keys(tgtTown).length > 0;
  const BONUS = {vp:'VP', income:'INC', money:'£', develop:'DEVELOP'};
  for (const mo of s.all_merchants) {
    const m = mo.id || mo, [x, y] = C[m];
    const live = s.merchants[m];
    const btxt = !mo.bonus ? '' : mo.bonus === 'develop' ? 'DEVELOP'
               : mo.bonus === 'money' ? `+£${mo.amount}`
               : `+${mo.amount} ${BONUS[mo.bonus]}`;
    out += `<g opacity="${narrowing && !tgtTown[m] ? 0.45 : 1}">
            <rect x="${x-46}" y="${y-22}" width="92" height="54" rx="9"
            fill="var(--badge)" stroke="${live ? 'var(--ink3)' : 'var(--line2)'}"/>
            <text x="${x}" y="${y-10}" text-anchor="middle">${m}</text>`;
    if (btxt)
      // A tinted band, so the reward reads as the merchant's own and not as
      // something written on the map near it.
      out += `<rect x="${x-45}" y="${y+14}" width="90" height="17" rx="0"
               fill="var(--accent)" fill-opacity="0.13"/>
              <path d="M${x-45} ${y+14} h90" stroke="var(--ink3)" stroke-width="1"/>
              <text x="${x}" y="${y+26}" text-anchor="middle"
               style="font-size:11px;font-weight:700;fill:var(--accent);
                      letter-spacing:.3px">${btxt}</text>`;
    if (live) {
      // Each slot: what it takes, and whether its beer barrel is still there.
      const sw = 30, tot = live.length * sw;
      live.forEach((sl, j) => {
        const gx = x - tot/2 + j*sw;
        if (sl.kind === 'blank')
          out += `<text x="${gx+11}" y="${y+8}" text-anchor="middle"
                   class="tname">—</text>`;
        else if (sl.kind === 'any')
          out += `<text x="${gx+11}" y="${y+8}" text-anchor="middle"
                   style="font-size:9px;font-weight:700;fill:var(--text)">ANY</text>`;
        else
          out += icon(sl.kind, gx + 2, y - 7, 17,
                      ICOL[sl.kind] || 'var(--text)', 1, 'var(--badge)');
        // The barrel is the thing that decides whether a sale is possible.
        out += sl.beer
          ? `<circle cx="${gx+22}" cy="${y-1}" r="5" fill="var(--accent)"
              stroke="#6b5a33" stroke-width="0.8"><title>beer available</title></circle>`
          : `<circle cx="${gx+22}" cy="${y-1}" r="5" fill="none"
              stroke="var(--ink3)" stroke-dasharray="2 2"><title>beer gone</title></circle>`;
      });
    } else {
      out += `<text x="${x}" y="${y+10}" text-anchor="middle" class="tname">unused</text>`;
    }
    out += `</g>`;
  }

  // Towns: one box per industry slot. A built tile shows its industry as an
  // icon with the level as a corner badge; an EMPTY slot shows faint icons of
  // what may be built there, which the two-letter version could not do at all
  // (a slot taking coal or iron rendered as "CI").
  const at = {};
  s.tiles.forEach(t => at[t.town + ':' + t.slot] = t);
  // Where the resources physically are. "Is there connected coal left, or does
  // this build hit the market?" is the question the board exists to answer.
  const RES = {coal_mine:'coal', iron_works:'iron', brewery:'beer'};
  const resTotal = {coal:0, iron:0, beer:0}, resTown = {coal:{}, iron:{}, beer:{}};
  for (const t of (s.tiles || [])) {
    const r = RES[t.industry];
    if (!r || !t.resources) continue;
    resTotal[r] += t.resources;
    resTown[r][t.town] = (resTown[r][t.town] || 0) + t.resources;
  }
  for (const mid in (s.merchants || {}))
    for (const sl of s.merchants[mid])
      if (sl.beer) { resTotal.beer += sl.beer;
                     resTown.beer[mid] = (resTown.beer[mid] || 0) + sl.beer; }

  // Merchant boxes are drawn at a fixed size around their coordinate; a town
  // label sitting above its slots lands inside one at Stoke-on-Trent and at the
  // southern farm brewery. Rather than bake offsets that rot when a coordinate
  // moves, test it and drop the label below the slots when the space is taken.
  const mrect = s.all_merchants.map(mo => {
    const [mx, my] = C[mo.id || mo];
    return [mx - 46, my - 22, mx + 46, my + 32];
  });
  const clashes = (cx, cy, txt) => {
    const hw = txt.length * 2.3 + 2;
    const r = [cx - hw, cy - 8, cx + hw, cy + 2];
    return mrect.some(m => r[0] < m[2] && r[2] > m[0] && r[1] < m[3] && r[3] > m[1]);
  };
  for (const t of s.towns) {
    const [x, y] = C[t.id], n = t.slots.length, w = 32, total = n * w;
    const ly = clashes(x, y - 20, t.name) ? y + 26 : y - 20;
    // A town the chosen card cannot reach stays visible but recedes.
    out += `<g opacity="${narrowing && !tgtTown[t.id] ? 0.58 : 1}">`;
    // The town a chosen location card names, so picking the card shows you
    // where on the map it points before you have picked what to do there.
    if (card !== null && s.hand[card] && s.hand[card].town === t.id)
      out += `<circle cx="${x}" cy="${y}" r="${total/2 + 14}" fill="var(--accent)"
               fill-opacity="0.10" stroke="var(--accent)" stroke-width="2.2"
               stroke-dasharray="6 4"><title>${t.name}: the card you picked</title>
              </circle>`;
    if (resFilter && resTown[resFilter][t.id]) {
      tgt += `<circle cx="${x}" cy="${y}" r="${total/2 + 12}" fill="none"
               stroke="var(--accent)" stroke-width="1.4" stroke-dasharray="3 3"
               opacity="0.85"><title>${resTown[resFilter][t.id]} ${resFilter}</title>
              </circle>`;
    }
    if (tgtTown[t.id]) {
      const hits = tgtTown[t.id].length;
      tgt += `<g class="tgt" data-act="town" data-id="${t.id}"
               tabindex="0" role="button"
               aria-label="${hits} option${hits === 1 ? '' : 's'} at ${t.name}">
        <rect x="${x-total/2-5}" y="${y-19}" width="${total+10}" height="39" rx="9"
         fill="var(--accent)" fill-opacity="0.10"
         stroke="var(--accent)" stroke-width="1.6"/>
        <title>${hits} option${hits === 1 ? '' : 's'} here</title></g>`;
    }
    out += `<text x="${x}" y="${ly}" text-anchor="middle" class="tname"
             ${t.farm ? 'style="font-style:italic;opacity:.75"' : ''}
             >${t.name}</text>`;
    t.slots.forEach((slot, i) => {
      const sx = x - total/2 + i*w, bw = w - 4, tile = at[t.id + ':' + i];
      if (tile) {
        // Unflipped tiles are drawn hollow: the tile is on the board but has
        // not scored, which is the distinction that decides most of the game.
        const c = COL[tile.owner], flipped = tile.flipped;
        out += `<rect x="${sx}" y="${y-13}" width="${bw}" height="27" rx="5"
                fill="${flipped ? 'url(#gp' + tile.owner + ')' : 'transparent'}"
                fill-opacity="${flipped ? 1 : 0}"
                stroke="${c}" stroke-width="${flipped ? 1 : 2}"
                stroke-dasharray="${flipped ? '' : '3 2'}"/>`;
        // A light top edge and a dark bottom one is the cheapest thing that
        // reads as a physical tile instead of a filled rectangle.
        if (flipped)
          out += `<path d="M${sx+1.5} ${y-11.5} h${bw-3}" stroke="#fff"
                   stroke-opacity="0.40" stroke-width="1" fill="none"/>
                  <path d="M${sx+1.5} ${y+12.5} h${bw-3}" stroke="#000"
                   stroke-opacity="0.26" stroke-width="1" fill="none"/>`;
        out += icon(tile.industry, sx + bw/2 - 9, y - 10.5, 19,
                    flipped ? 'var(--onaccent)' : ICOL[tile.industry] || c,
                    1, flipped ? null : 'var(--boardA)');
        out += `<text x="${sx+bw-4}" y="${y+12}" text-anchor="end"
                style="font-size:9px;font-weight:700;fill:${flipped ? 'var(--onaccent)' : c}"
                >${tile.level}</text>`;
        // Only a flipped tile is worth anything, so only a flipped one says so.
        if (flipped && tile.vp)
          out += `<text x="${sx+3}" y="${y+12}"
                   style="font-size:8.5px;font-weight:700;fill:var(--onaccent);opacity:.85"
                   >${tile.vp}v</text>`;
        out += `<title>${NAME[tile.industry]} L${tile.level}, seat ${tile.owner}`
             + `${flipped ? ' — flipped' : ' — NOT flipped, scores nothing yet'}`
             + `${tile.level === 1 && s.era === 'canal'
                  ? ' — level 1: removed at the era boundary' : ''}</title>`;
        // Level 1 in the Canal Era is swept at the boundary whether it flipped
        // or not. The mat warned about this and the board did not.
        if (tile.level === 1 && s.era === 'canal')
          out += `<path d="M${sx+bw-7} ${y-13} l7 7" stroke="var(--bad)"
                   stroke-width="2" stroke-linecap="round" opacity="0.9"/>`;
        if (tile.resources)
          out += `<circle cx="${sx+bw-5}" cy="${y-10}" r="5.5" fill="#d9a441"
                   stroke="#6b5a33" stroke-width="0.8"/>
                  <text x="${sx+bw-5}" y="${y-7}" text-anchor="middle"
                   style="font-size:8px;font-weight:700;fill:var(--onaccent)"
                   >${tile.resources}</text>`;
      } else {
        out += `<rect x="${sx}" y="${y-13}" width="${bw}" height="27" rx="5"
                fill="url(#gslot)" stroke="var(--line2)"/>
                <path d="M${sx+1.5} ${y-11.5} h${bw-3}" stroke="#fff"
                 stroke-opacity="0.55" stroke-width="1" fill="none"/>`;
        const k = slot.length, isize = k > 2 ? 12 : 15;
        slot.forEach((ind, j) => {
          const ix = sx + bw/2 - (k * isize) / 2 + j * isize;
          out += icon(ind, ix, y - isize/2, isize, ICOL[ind] || 'var(--ink3)', 1);
        });
        out += `<title>${slot.map(i2 => NAME[i2]).join(' or ')}</title>`;
      }
    });
    out += `</g>`;
  }
  // Only the live layer is re-serialised. #lay-fx survives a redraw, which is
  // what lets a hover ghost exist at all, and <defs> keeps stable ids.
  if (resFilter === 'beer')
    for (const mo of s.all_merchants) {
      const mid = mo.id || mo;
      if (!resTown.beer[mid]) continue;
      const [mx, my] = C[mid];
      tgt += `<rect x="${mx-58}" y="${my-28}" width="116" height="56" rx="12"
               fill="none" stroke="var(--accent)" stroke-width="1.4"
               stroke-dasharray="3 3" opacity="0.85"/>`;
    }
  //
  // innerHTML destroys the focused node, so keyboard play is impossible unless
  // focus is restored to whatever replaced it.
  const wasFocused = document.activeElement;
  const keep = wasFocused && wasFocused.closest && wasFocused.closest('[data-act]');
  const keepId = keep && [keep.dataset.act, keep.dataset.id];
  document.getElementById('lay-live').innerHTML = out + tgt;
  if (keepId) {
    const again = document.querySelector(
      `[data-act="${keepId[0]}"][data-id="${keepId[1]}"]`);
    if (again) again.focus();
  }
  clearGhost();
  // play() removes the hovered button without firing mouseleave, so the ring
  // hi() drew would otherwise outlive the thing that asked for it.
  const stale = document.getElementById('hl');
  if (stale) stale.remove();

  document.getElementById('era').textContent =
    `${s.era} era · round ${s.round}/${s.rounds_this_era}`;

  // Banked VP is near zero for everyone through the Canal Era, so the raw
  // number tells you nothing about where you stand. The projected figure is
  // what to read; it is shown in brackets.
  document.getElementById('seats').innerHTML = s.players
    .slice().sort((a,b) => (a.order ?? 9) - (b.order ?? 9)).map(p => `
    <div class="seat ${p.idx === s.seat ? 'me' : ''} ${p.idx === s.current ? 'turn' : ''}"
      onmouseenter="hiSeat(${p.idx})" onmouseleave="hiSeat(null)">
      <span><span class="dot" style="background:${COL[p.idx]}"></span>
      ${p.idx === s.seat ? 'You' : 'Bot ' + p.idx}
      ${p.idx === s.current ? ' ←' : ''}
      <small style="white-space:nowrap"
        title="turn position, and cash spent this round -- least spent goes first next round"
        >&nbsp;#${(p.order ?? 0) + 1} · £${p.spent}sp</small></span>
      <span class="num" style="text-align:right"
        title="projected final score, if the game ended now"
        ><strong>${p.projected}</strong></span>
      <span class="num meta" style="text-align:right"
        title="VP actually banked so far">${p.vp}</span>
      <span class="num meta" style="text-align:right"
        title="cash">£${p.money}</span>
      <span class="num meta" style="text-align:right"
        title="income level, and spaces to the next">${p.income}${
          p.income_to_next ? `<sub>+${p.income_to_next}</sub>` : ''}</span>
      <span class="num meta" style="text-align:right"
        title="link tiles left / cards in hand">${p.links_left}/${p.hand}</span>
    </div>`).join('');

  // Markets: the PRICE is the number you reason with, not the cube count, and
  // a mine or works built into a short market sells its cubes on placement.
  // The market as it physically sits: a column per resource, dearest at the
  // top, cheapest at the bottom, two cubes to a price. Cubes are bought from
  // the cheap end, so the empty spaces are always the bottom of the column and
  // the lowest cube still in it is the one you will pay for next. The dashed
  // box above each column is what a cube costs once the column is bare.
  const mkt = (name, held, cap, price) => {
    const slots = (name === 'coal' ? s.coal_slots : s.iron_slots) || [];
    const empty = (name === 'coal' ? s.coal_empty_price : s.iron_empty_price);
    // Group the flat list of spaces by price. Two to a price today, but read
    // off the data rather than assumed, because that is a rule of the board and
    // not of this panel.
    const rows = [];
    for (const sl of slots) {
      const row = rows.find(r => r.price === sl.price);
      (row || (rows[rows.push({price: sl.price, cells: []}) - 1])).cells.push(sl);
    }
    rows.sort((a, b) => b.price - a.price);
    const next = slots.find(sl => sl.cube);   // the cube you would buy now
    const lad = rows.map(r =>
      `<span class="pr">£${r.price}</span>` + r.cells.map(sl =>
        `<span class="cube ${name} ${sl.cube ? 'full' : ''}${
           next && sl === next ? ' next' : ''}"
          title="£${sl.price}${sl.cube ? (sl === next ? ' — the next one you buy'
                                                      : '') : ' — empty'}"
          ></span>`).join('')).join('');
    const note = held === 0 ? '<div class="gone">empty — builds sell out</div>'
               : held <= 3 ? '<div class="warn">short</div>' : '';
    return `<div class="mkt2">
      <div class="empt" title="what one costs once the market is bare"
        >£${empty}</div>
      <div class="lad" style="grid-template-columns:auto repeat(${
        Math.max(...rows.map(r => r.cells.length))}, auto)">${lad}</div>
      <div class="mname">${name}</div>
      <div class="mcount">${held}/${cap} · now £${price}</div>${note}</div>`;
  };
  // Deck exhaustion is what ends each era, and the hand shrinks to one card
  // per remaining action once it runs dry -- invisible until it bites.
  const rb = document.getElementById('restartbtn');
  if (rb) {
    rb.textContent = armed === 'restart' ? 'again to restart' : '↻ Restart';
    rb.className = armed === 'restart' ? 'sel' : '';
    rb.title = 'deal a fresh board with the same players and opponent';
  }
  const eb = document.getElementById('endbtn');
  if (eb) {
    eb.textContent = armed === 'end' ? 'again to end' : '⏹ End';
    eb.className = armed === 'end' ? 'sel' : '';
    eb.title = 'stop here and show the standings; this cannot be undone';
    eb.disabled = !!(s.ended || s.finished);
  }
  // A finished game saves itself, so the button stops asking for a press and
  // starts reporting. It stays for the other case: a game still in progress
  // that you want on disk before you walk away from it.
  const xb = document.getElementById('exportbtn');
  if (xb) {
    xb.textContent = s.autosaved ? '✓ Saved' : '⭳ Export';
    xb.disabled = !!s.autosaved;
    xb.title = s.autosaved
      ? 'this game was written to logs/ the moment it ended'
      : 'write the game so far to logs/, in the same format as the pasted '
        + 'Boomforge logs, so the analysis scripts can read it';
  }
  const ex = document.getElementById('exported');
  if (ex && s.exported)
    ex.textContent = (s.autosaved ? '' : '→ ') + s.exported.split('/').pop();
  const fb = document.getElementById('foldbtn');
  if (fb && !fb.textContent) { fb.textContent = FOLD[0].label;
                               fb.title = FOLD[0].hint; }
  railWidths();
  const sb = document.getElementById('stopbtn');
  if (sb) {
    sb.textContent = armed === 'stop' ? 'again to stop it' : '⏻ Stop';
    sb.className = armed === 'stop' ? 'sel' : '';
    // One process serves every room, so this is not "leave the table". Say so
    // on the button rather than letting someone find out by ending three other
    // people's games.
    sb.title = (s.rooms || []).length > 1
      ? `shut the whole server down, ending all ${s.rooms.length} tables. `
        + 'Export anything you want to keep first.'
      : 'shut the server down. This game is gone unless you export it first.';
  }
  if (s.stopping) {
    document.body.innerHTML =
      '<div style="padding:40px;font:16px/1.6 ui-sans-serif,system-ui,sans-serif">'
      + '<h1 style="font-size:20px;margin:0 0 8px">Server stopped.</h1>'
      + '<p class="meta">Nothing is listening on this port any more. '
      + 'Start it again with <code>.venv/bin/python tools/serve.py</code>.</p></div>';
    return;
  }
  const turnEl = document.getElementById('turn');
  turnEl.textContent = s.ended ? 'ended early'
      : s.finished ? 'game over'
      : s.current === s.seat
        ? `your turn · ${s.actions_left} action${s.actions_left === 1 ? '' : 's'} left`
        : `Bot ${s.current} to move`;
  turnEl.className = (s.current === s.seat && !s.finished && !s.ended)
      ? 'mine' : '';
  const roomEl = document.getElementById('room');
  if (roomEl)
    roomEl.innerHTML = `table <b>${s.room || 'main'}</b>` + (
      (s.rooms || []).length > 1
        ? ` <span class="meta">of ${s.rooms.length}</span>` : '');
  const rchip = (k) => `<a href="#" onclick="pickRes('${k}');return false"
      style="color:${resFilter === k ? 'var(--accent)' : 'inherit'};
             text-decoration:none;font-weight:${resFilter === k ? 700 : 400}"
      >${k} ${resTotal[k]}</a>`;
  document.getElementById('res').innerHTML =
    'on the board &nbsp;' + ['coal','iron','beer'].map(rchip).join(' &nbsp;· ');
  // Deck exhaustion ends the era and the market price is what a build really
  // costs, so these are figures, not prose. One label above each.
  const stat = (k, v, sub2) => `<span class="stat"><span class="k">${k}</span>
      <span class="v">${v}${sub2 ? ` <small>${sub2}</small>` : ''}</span></span>`;
  document.getElementById('stats').innerHTML =
      stat('deck', s.deck)
    + stat('discard', s.discard)
    + stat('wild', `${s.wild_city}<small>c</small> / ${s.wild_ind}<small>i</small>`);
  const lg = (svgBits, text, box) =>
    `<span><svg width="${box || 16}" height="${box || 16}"
       viewBox="0 0 ${box || 16} ${box || 16}">${svgBits}</svg></span>
     <span>${text}</span>`;
  document.getElementById('legend').innerHTML =
    Object.keys(NAME).map(k =>
      lg(icon(k, 1, 1, 17, ICOL[k] || 'var(--dim)', 1), NAME[k], 17)).join('')
    + lg(`<rect x="1" y="3" width="14" height="10" rx="3" fill="var(--p0)"/>`,
         'flipped — has scored')
    + lg(`<rect x="1" y="3" width="14" height="10" rx="3" fill="none"
           stroke="var(--p0)" stroke-width="2" stroke-dasharray="3 2"/>`,
         'built, NOT flipped — scores nothing yet')
    + lg(`<circle cx="8" cy="8" r="5" fill="var(--accent)"/>`, 'beer still on the tile')
    + lg(`<circle cx="8" cy="8" r="6.5" fill="var(--badge)" stroke="var(--ink3)"/>
          <text x="8" y="11" text-anchor="middle"
           style="font-size:8px;font-weight:700;fill:var(--accent)">2</text>`,
         'what this link scores now')
    + lg(`<line x1="1" y1="8" x2="15" y2="8" stroke="var(--line2)" stroke-width="2"
           stroke-dasharray="4 3"/>`, 'canal route')
    + lg(`<line x1="1" y1="8" x2="15" y2="8" stroke="var(--line2)" stroke-width="2"/>`,
         'rail route');
  document.getElementById('markets').innerHTML = '<div class="mkts">'
    + mkt('coal', s.coal_market, s.coal_cap, s.coal_price)
    + mkt('iron', s.iron_market, s.iron_cap, s.iron_price)
    + '</div>';

  // The mat: what a Build would actually place for each industry.
  if (matSeat >= (s.mats || []).length) matSeat = s.seat;
  document.getElementById('mattabs').innerHTML = (s.mats || []).map((_, i) =>
    `<button class="kind ${i === matSeat ? 'sel' : ''}" onclick="pickMat(${i})">
      <span class="dot" style="background:${COL[i]}"></span>
      ${i === s.seat ? 'You' : 'Bot ' + i}</button>`).join('');
  const shown = (s.mats && s.mats[matSeat]) || s.mat;
  document.getElementById('mat').innerHTML = Object.entries(shown).map(([ind, m], row) => {
    const mr = row ? ' mr' : '';
    if (m.next === null) return `<span class="ind${mr}">${matIcon(ind)}${MATNAME[ind]}</span>
        <span class="gone${mr}">exhausted</span><span class="pile${mr}"></span>`;
    const pips = m.by_level.map((n, i) => {
      const lvl = i + 1;
      const cls = n === 0 ? '' : (lvl === m.next ? 'pip next' : 'pip have');
      return `<span class="${cls || 'pip'}" title="L${lvl}: ${n} left"></span>`;
    }).join('');
    const flags = (m.canal_only ? ' <span class="warn" title="canal only — removed at the boundary whether it flipped or not">canal-only</span>' : '')
                + (m.rail_only ? ' <span class="warn">rail-only</span>' : '');
    const beer = m.beer ? ` · ${m.beer} beer` : (m.beer === 0 ? ' · no beer' : '');
    // Whether you can actually place this next tile right now. `buildable` is
    // exact -- it comes from the legal move list -- so the cash figure is only
    // offered as the reason when money is genuinely what is missing.
    // "blocked" collapsed four situations that call for four different turns.
    // The server now says which one, so the player is told the thing they would
    // have to change.
    const afford = m.buildable === undefined
      ? `<span class="meta">£${m.cash} all in</span>`
      : m.buildable
      ? '<span class="ok">can build now</span>'
      : `<span class="${/^short/.test(m.reason || '') ? 'warn' : 'gone'}">${
          m.reason || 'blocked'}</span>`;
    // The pile under the top tile. A Develop's whole point is what comes
    // next, and the mat showed only the tile you would place now, so the
    // question it exists to answer was the one thing it did not carry.
    const open = !!matOpen[ind];
    const stack = !open ? '' : `<div class="stack">` + (m.stack || [])
      .filter(t => t.left > 0)
      .map(t => `<span class="lv ${t.level === m.next ? 'nx' : ''}">L${t.level}</span>
         <span class="meta">&times;${t.left}</span>
         <span class="meta">£${t.cost}${t.coal ? '+' + t.coal + 'c' : ''}${
            t.iron ? '+' + t.iron + 'i' : ''} · ${t.vp}vp · +${t.income}inc${
            t.beer ? ' · ' + t.beer + ' beer' : ''}${
            t.link_vp ? ' · ' + t.link_vp + '\u22B7' : ''}${
            t.canal_only ? ' · canal only' : t.rail_only ? ' · rail only' : ''}</span>`)
      .join('') + `</div>`;
    return `<span class="ind${mr}">${matIcon(ind)}${MATNAME[ind]}</span>
      <span class="pile${mr}"><button class="stackbtn" onclick="toggleStack('${ind}')"
          title="every tile still in this pile, not just the one on top"
          >${open ? '\u25BE' : '\u25B8'}</button>
        <span class="lv">L${m.next}</span> <span class="pips">${pips}</span>
        <span class="meta">${m.remaining} left</span>${flags}</span>
      <span class="meta${mr}"><b>£${m.cost}${m.coal ? '+' + m.coal + 'c' : ''}${
          m.iron ? '+' + m.iron + 'i' : ''}</b>
        · <b>${m.vp}vp</b> · +${m.income}inc${beer}${
          m.produces ? ' · puts ' + m.produces : ''}
        ${m.link_vp ? ' · ' + m.link_vp + '⊷' : ''}<br>${afford}</span>${stack}`;
  }).join('');

  // --- hand -> action type -> choice ------------------------------------
  // Cards carry a count of what they can actually do, so a dead card is
  // visibly dead instead of being something you click and find empty.
  // Two cards with the same face are interchangeable, but the engine
  // enumerates one index per DISTINCT card -- so a second copy picked up only
  // whatever _discard_variants attached to it and offered 1 move where its twin
  // offered 65. Group by what the card IS, not which slot it sits in.
  const byCard = {};
  s.moves.forEach(m => {
    const k = sigAt(m.card);
    (byCard[k] = byCard[k] || []).push(m);
  });
  if (card !== null && !byCard[sigAt(card)]) card = null;

  TOWNNAME = {};
  (s.towns || []).forEach(t => TOWNNAME[t.id] = t.name);

  // A card face says what KIND of card it is, what it names, and how many
  // moves it actually unlocks -- so a dead card is visibly dead rather than
  // something you click and find empty.
  // The move COUNT is a solver statistic -- it is dominated by discard
  // variants, so it barely differs between cards while sitting on the most
  // prominent line of each one. What the card can DO is the useful signal.
  const VERB = {Build:'build', Network:'link', Sell:'sell', Develop:'develop',
                Scout:'scout', Loan:'loan', Pass:'pass'};
  // Loan, Pass and Scout come with almost any card, so printing them on every
  // card face says nothing and buries the two verbs that actually differ.
  const UNIVERSAL = new Set(['loan', 'pass', 'scout']);
  // One hue per card, driving border, art panel and name band together -- which
  // is what makes the reference's hand read as a row of distinct cards rather
  // than a row of identical boxes.
  const cardHue = c => {
    const key = (c.industries && c.industries.length)
      ? c.industries.join('/') : (c.town || c.kind);
    let h = 0;
    for (const ch of key) h = (h * 37 + ch.charCodeAt(0)) % 360;
    return h;
  };

  // The hand is drawn in the order YOU arranged it, not the order the server
  // happens to hold it in. Reconciled by card identity so an arrangement
  // survives playing a card and drawing a new one -- cards that are still
  // there keep their place, and anything new joins the end.
  reconcileHand(s.hand);
  let selCard = null;
  document.getElementById('hand').innerHTML = handOrder.map((i, pos) => {
    const c = s.hand[i];
    const n = (byCard[sigAt(i)] || []).length;
    // Every card gets a mark: its industry when it names one, a townhouse for
    // a location, crossed arrows for a wild.
    const ind = (c.industries && c.industries.length === 1) ? c.industries[0]
              : c.town ? 'city'
              : (c.industries && c.industries.length) ? c.industries[0] : 'wild';
    const glyph = ICON[ind]
      ? `<svg width="32" height="32" viewBox="0 0 32 32">${
          icon(ind, 1, 1, 30, ICOL[ind] || '#4a4034', 1)}</svg>`
      : '';
    // The verbs move into the tooltip: the reference's card carries only its
    // kind, its art and its name. The verbs were our addition, not something
    // the card itself says.
    const verbs = n ? (v => v.length ? v.join(' · ') : 'loan or pass only')(
      [...new Set((byCard[sigAt(i)] || []).map(m => VERB[m.kind]))]
        .filter(v => v && !UNIVERSAL.has(v))) : 'no moves';
    const tint = CARDTINT[ind];
    const hue = cardHue(c);
    const vars = tint ? `--ct:${tint[0]}; --cbg:${tint[1]}; --cband:${tint[2]}`
                      : `--ct:hsl(${hue} 45% 46%); --cbg:hsl(${hue} 38% 91%);
                         --cband:hsl(${hue} 34% 85%)`;
    const small = ICON[ind]
      ? `<svg width="16" height="16" viewBox="0 0 17 17">${
          icon(ind, 1, 1, 15, ICOL[ind] || '#4a4034', 1)}</svg>` : '';
    if (i === card) selCard = {c, glyph, vars};
    return `<button class="hc ${i === card ? 'sel' : ''} ${n ? '' : 'dead'}"
      style="${vars}"
      title="${verbs} — drag to reorder"
      draggable="true"
      ondragstart="dragCard(event, ${pos})"
      ondragover="overCard(event, ${pos})"
      ondragleave="this.classList.remove('over')"
      ondragend="endCard(event)"
      ondrop="dropCard(event, ${pos})"
      ${n ? `onclick="pickCard(${i})"` : 'disabled'}>
      ${small}<b>${cardLabel(c)}</b>
    </button>`;
  }).join('') || '<span class="empty">no cards</span>';
  // The chosen card at full size, as the reference draws it, beside the list.
  document.getElementById('handsel').innerHTML = selCard
    ? `<div class="card sel" style="${selCard.vars}; cursor:default">
         <span class="ck">${selCard.c.town ? 'City' : 'Industry'}</span>
         <span class="art">${selCard.glyph}</span>
         <b>${cardLabel(selCard.c)}</b></div>` : '';
  document.getElementById('movecount').textContent =
    s.hand.length + ' cards';
  const meP = s.players[s.seat];
  document.getElementById('cash').textContent = meP ? '£' + meP.money : '';

  // Every action, always shown, enabled only where the SELECTED card can
  // reach it. Their availability is the information -- hiding the ones you
  // cannot take would remove the reason you cannot take them.
  const ACTS = [['Build','⌂'], ['Network','↑'], ['Sell','⌗'], ['Develop','↗'],
                ['Scout','⌕'], ['Loan','£']];
  const tray = document.getElementById('tray');
  if (tray) tray.dataset.mode = (card !== null && kind !== null) ? 'options' : 'browse';
  const abox = document.getElementById('actions'),
        box  = document.getElementById('details');
  const mine = card === null ? [] : (byCard[sigAt(card)] || []);
  const avail = {};
  mine.forEach(m => avail[m.kind] = (avail[m.kind] || 0) + 1);
  // Scout discards three cards but the engine labels only the most expendable
  // of them as "the card", so counting by that greys the button out for a card
  // you can perfectly well scout away as one of the other two.
  if (card !== null) {
    const n = (s.moves || []).filter(m => m.kind === 'Scout'
      && [m.card, ...m.extra].some(i => sigAt(i) === sigAt(card))).length;
    if (n) avail.Scout = n;
  }
  if (kind !== null && !avail[kind]) kind = null;

  // A greyed button that will not say WHY is worse than no button: "I am
  // broke" and "nothing I can reach" are different answers and lead to
  // different turns. The mat already distinguishes them; the reason just lived
  // on the wrong panel.
  // Returns [short, full]: the short form shares the button's line with its
  // label, the full one is the tooltip.
  const whyNot = (k) => {
    if (card === null) return ['', 'pick a card first'];
    if (s.moves.some(m => m.kind === k))
      return ['other card', 'another card in hand can do this, but not this one'];
    const mats = Object.values(s.mat).filter(m => m.next !== null);
    if (k === 'Build') {
      // If nothing is buildable and anything is short of cash, cash is the
      // binding constraint worth naming -- the cheapest gap is the useful one.
      const shorts = mats.filter(m => m.short > 0).map(m => m.short);
      if (shorts.length)
        return [`short £${Math.min(...shorts)}`,
                `the cheapest tile you could place costs £${Math.min(...shorts)} more than you hold`];
      return ['no slot', 'no reachable slot takes anything you can still build'];
    }
    if (k === 'Sell') return ['no sale', 'nothing of yours is sellable, or there is no beer for it'];
    if (k === 'Network') return ['no link', 'no link you can reach is still unbuilt'];
    if (k === 'Scout') return ['no scout', 'scouting needs two cards to discard and no wild in hand'];
    return ['—', 'not legal this turn'];
  };
  const WHY = {};
  ACTS.concat([['Pass']]).forEach(([k]) => { WHY[k] = whyNot(k); });
  abox.innerHTML = ACTS.map(([k, g]) => {
    const n = avail[k] || 0;
    const [why, whyFull] = n ? ['', ''] : WHY[k];
    return `<button class="${k === kind ? 'sel' : ''}" ${n ? '' : 'disabled'}
      ${n ? `onclick="pickKind('${k}')"` : ''}
      title="${n ? n + ' option' + (n === 1 ? '' : 's') + ' with this card' : whyFull}"
      >${g} ${k}${n > 1 ? ` <small>${n}</small>` : ''}${
        n || !why ? '' : `<small class="why">${why}</small>`}</button>`;
  }).join('');
  // Pass needs no card and Undo rewinds past the bots' replies to the position
  // you chose from, so neither is greyed by which card is selected. Both sit on
  // the header line rather than in the grid of things a card lets you do.
  // Passing in Brass still discards a card, so it is gated on the selected
  // card exactly as it was when it lived in the grid: enabling it with no card
  // chosen would give a button that looks live and does nothing.
  const passN = avail.Pass || 0;
  document.getElementById('turnbtns').innerHTML =
    `<button class="tbtn ${kind === 'Pass' ? 'sel' : ''}"
      ${passN ? `onclick="pickKind('Pass')"` : 'disabled'}
      title="${passN ? 'give up this action, discarding the chosen card'
                     : (card === null ? 'pick a card first' : WHY.Pass[1])}"
      >Pass</button>
     <button class="tbtn" ${s.can_undo ? 'onclick="undo()"' : 'disabled'}
      title="take back your last action, and the bot replies to it"
      >Undo</button>`;

  const rbox = document.getElementById('results');
  if (rbox) {
    const show = !!s.summary && !resultsHidden;
    rbox.hidden = !show;
    if (show) rbox.innerHTML = renderResults(s.summary, s);
  }
  if (s.ended && !s.finished) {
    abox.innerHTML = '';
    const who = i => i === s.seat ? 'You' : 'Bot ' + i;
    box.innerHTML = `<p><strong>Ended early.</strong> Projected standings —
      the game did not reach its own scoring, so these include unflipped tiles
      and links at their expected value.</p>`
      + s.players.slice().sort((a, b) => b.projected - a.projected).map(p =>
        `<div><span class="dot" style="background:${COL[p.idx]}"></span>
         ${who(p.idx)} <strong>${p.projected}</strong>
         <span class="meta">(${p.vp} banked)</span></div>`).join('');
  } else if (s.finished) {
    const who = i => i === s.seat ? 'You' : 'Bot ' + i;
    box.innerHTML = `<p><strong>Game over.</strong> Winner: ${
      s.winners.map(who).join(', ')}
      <button onclick="toggleResults()" style="margin-left:8px;font-size:11px;padding:3px 8px"
        >${resultsHidden ? 'Show the breakdown' : 'Show the board'}</button></p>`
      + s.players.slice().sort((a, b) => b.vp - a.vp).map(p =>
        `<div><span class="dot" style="background:${COL[p.idx]}"></span>
         ${who(p.idx)} <strong>${p.vp}</strong></div>`).join('');
  } else if (!s.moves.length) {
    box.innerHTML = '<p class="empty">Bots are thinking…</p>';
  } else if (card === null) {
    box.innerHTML = '<p class="hint">Select a card, then an action.</p>';
  } else if (kind === null) {
    box.innerHTML = '<p class="hint">Now choose what to do with it.</p>';
  } else {
    let opts = mine.filter(m => m.kind === kind);
    const onMap = Object.keys(tgtTown).length || Object.keys(tgtLine).length;
    if (focus) {
      const narrowed = opts.filter(m =>
        m.town === focus || (m.lines || []).includes(focus)
        || (m.sales || []).some(sa => sa.town === focus));
      if (narrowed.length) opts = narrowed;
      else focus = null;
    }
    box.innerHTML =
      (onMap && !(kind === 'Network' && focus)
       && !(kind === 'Build' && bind === null && !focus
            && new Set(opts.map(m => m.industry)).size > 1) ? `<p class="hint">${focus
          ? 'Showing ' + focus.replace(/_/g, ' ') + ' — or click elsewhere on the map.'
          : 'Click a highlighted spot on the map, or choose below.'}</p>` : '')
      + renderKind(kind, opts, s);
  }

  const lm = document.getElementById('logmode');
  if (lm) lm.textContent = logProse ? 'prose' : 'detail';
  // Grouped by round. A flat list of twenty actions hides where a turn ended,
  // which is the boundary everything in this game is timed against.
  let last = null, rows = '';
  for (const l of s.log.slice().reverse()) {
    const key = l.era === undefined ? null : `${l.era} ${l.round}`;
    if (key && key !== last) {
      rows += `<div class="rnd">${key}</div>`;
      last = key;
    }
    rows += `<div><span class="dot" style="background:${COL[l.seat]}"></span>
      <span style="color:${l.seat === s.seat ? 'var(--accent)' : 'var(--dim)'}">
      ${l.seat === s.seat ? 'You' : 'Bot ' + l.seat}</span> ${
        logProse ? (l.pretty || l.text).replace(/^(You|Bot \d+) /, '') : l.text
      }</div>`;
  }
  document.getElementById('log').innerHTML = rows;
}

// Hovering a move rings the town it happens at. Reading a move like
// "BUILD coal_mine L1 at coalbrookdale" and then hunting the board for
// Coalbrookdale is the slowest part of using this.
function hi(town) {
  const old = document.getElementById('hl'); if (old) old.remove();
  if (!town || !S || !S.coords[town]) return;
  const [x, y] = S.coords[town];
  document.getElementById('svg').insertAdjacentHTML('beforeend',
    `<circle id="hl" cx="${x}" cy="${y}" r="34" fill="none"
     stroke="var(--accent)" stroke-width="2.5" opacity="0.9"/>`);
}
// Develop is the action that most needs collapsing: it offers every
// combination of one or two industries, which was 20 near-identical strings.
// Two dropdowns say the same thing in one line, and show the LEVEL each
// choice would remove -- the number that actually matters, since developing
// clears the lowest tile you hold.
function renderKind(kind, opts, s) {
  // What each merchant pays for a sale. Which merchant to sell into is one of
  // the few free choices in a Sell and the bonus is the entire basis for it,
  // so it belongs on the option rather than only on the board.
  const PERK = {};
  const BN = {vp:'VP', income:'INC', money:'£', develop:'DEVELOP'};
  for (const mo of (s.all_merchants || [])) {
    if (!mo.bonus) continue;
    PERK[mo.id] = mo.bonus === 'develop' ? 'free develop'
                : mo.bonus === 'money' ? `+£${mo.amount}`
                : `+${mo.amount} ${BN[mo.bonus]}`;
  }
  if (kind === 'Develop') {
    // Two slots, each a choice of industry. Fill one and you develop one tile;
    // fill both and you develop two. The old version asked you to find your
    // combination inside one of two separate dropdowns, each with its own
    // button -- which is the same decision presented as two.
    const key = a => a.slice().sort().join('|');
    const byKey = {};
    opts.forEach(m => byKey[key(m.industries)] = m);
    const all = [...new Set(opts.flatMap(m => m.industries))].sort();
    if (dev1 && !all.includes(dev1)) { dev1 = null; dev2 = null; }

    // What can share the action with whatever is in the first slot.
    const partners = !dev1 ? [] : [...new Set(opts
      .filter(m => m.industries.length === 2 && m.industries.includes(dev1))
      .map(m => { const c = m.industries.slice(); c.splice(c.indexOf(dev1), 1);
                  return c[0]; }))].sort();
