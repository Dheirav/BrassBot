<!doctype html>
<meta charset="utf-8">
<title>BrassBot</title>
<style>
  :root {
    --bg:#12141a; --panel:#1a1d25; --line:#2b303c; --text:#e6e8ee;
    --dim:#8b93a7; --accent:#e0a458;
    --p0:#4da3ff; --p1:#e05c5c; --p2:#5fc98a; --p3:#c88ce0;
  }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--text);
         font:14px/1.45 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
         display:grid; grid-template-columns:minmax(0,1fr) 380px; height:100vh }
  #board { padding:10px; overflow:auto }
  aside { background:var(--panel); border-left:1px solid var(--line);
          overflow-y:auto; padding:14px }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em;
       color:var(--dim); margin:18px 0 8px; font-weight:600 }
  h2:first-child { margin-top:0 }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap }
  .chip { background:#232733; border:1px solid var(--line); border-radius:6px;
          padding:3px 8px; font-size:12px }
  .seat { display:flex; justify-content:space-between; padding:6px 8px;
          border-radius:6px; border:1px solid var(--line); margin-bottom:5px }
  .seat.me { border-color:var(--accent) }
  .seat.turn { background:#232733 }
  .dot { width:9px; height:9px; border-radius:50%; display:inline-block;
         margin-right:6px; vertical-align:middle }
  button { font:inherit; background:#232733; color:var(--text);
           border:1px solid var(--line); border-radius:6px; padding:6px 10px;
           cursor:pointer }
  button:hover { border-color:var(--accent) }
  button.sel { background:var(--accent); color:#1a1d25; border-color:var(--accent) }
  .move { display:block; width:100%; text-align:left; margin-bottom:4px;
          font-size:12.5px; white-space:normal }
  .empty { color:var(--dim); font-style:italic }
  text { font:600 10px ui-sans-serif,system-ui,sans-serif; fill:var(--text);
         pointer-events:none }
  .tname { font-size:9px; fill:var(--dim) }
  #log div { font-size:12px; color:var(--dim); padding:2px 0;
             border-bottom:1px solid #20242e }
</style>
<div id="board"><svg id="svg" viewBox="0 0 1000 820"></svg></div>
<aside>
  <div class="row" style="margin-bottom:6px">
    <strong style="font-size:16px">BrassBot</strong>
    <span class="chip" id="era"></span>
    <span class="chip" id="market"></span>
  </div>
  <h2>Players</h2><div id="seats"></div>
  <h2>Your hand</h2><div class="row" id="hand"></div>
  <h2>Moves <span id="movecount" class="chip"></span></h2>
  <div class="row" id="filters" style="margin-bottom:8px"></div>
  <div id="moves"></div>
  <h2>Recent</h2><div id="log"></div>
</aside>
<script>
const COL = ['var(--p0)','var(--p1)','var(--p2)','var(--p3)'];
const SHORT = {coal_mine:'CO', iron_works:'IR', brewery:'BR',
               cotton_mill:'CT', manufacturer:'MF', pottery:'PO'};
let S = null, filter = 'All';

const post = (url, body) => fetch(url, {method:'POST',
  headers:{'Content-Type':'application/json'}, body:JSON.stringify(body||{})})
  .then(r => r.json()).then(draw);

function draw(s) {
  S = s;
  const C = s.coords, svg = document.getElementById('svg');
  let out = '';

  // links: every line on the board, built ones in their owner's colour
  const built = {};
  s.links.forEach(l => built[l.id] = l.owner);
  for (const l of (s.all_links || [])) {
    if (l.id in built) continue;
    const [a, b] = l.ends;
    out += `<line x1="${C[a][0]}" y1="${C[a][1]}" x2="${C[b][0]}" y2="${C[b][1]}"
            stroke="#2c3242" stroke-width="2" stroke-dasharray="5 5"/>`;
  }
  for (const l of s.links) {
    const [a, b] = l.ends;
    out += `<line x1="${C[a][0]}" y1="${C[a][1]}" x2="${C[b][0]}" y2="${C[b][1]}"
            stroke="${COL[l.owner]}" stroke-width="4" stroke-linecap="round"/>`;
  }

  // merchants
  for (const m of s.all_merchants) {
    const [x, y] = C[m];
    const live = s.merchants[m];
    const kinds = live ? live.map(sl => (sl.kind === 'blank' ? '-' :
      (SHORT[sl.kind] || 'ANY')) + (sl.beer ? '•' : '')).join(' ') : 'unused';
    out += `<rect x="${x-46}" y="${y-17}" width="92" height="34" rx="8"
            fill="#242938" stroke="${live ? 'var(--accent)' : '#333a4a'}"/>
            <text x="${x}" y="${y-3}" text-anchor="middle">${m.slice(0,10)}</text>
            <text x="${x}" y="${y+9}" text-anchor="middle" class="tname">${kinds}</text>`;
  }

  // towns, with one box per industry slot
  const at = {};
  s.tiles.forEach(t => at[t.town + ':' + t.slot] = t);
  for (const t of s.towns) {
    const [x, y] = C[t.id], n = t.slots.length, w = 26, total = n * w;
    out += `<text x="${x}" y="${y-16}" text-anchor="middle" class="tname">${t.name}</text>`;
    t.slots.forEach((slot, i) => {
      const sx = x - total/2 + i*w, tile = at[t.id + ':' + i];
      const fill = tile ? COL[tile.owner] : '#1e222c';
      const op = tile && !tile.flipped ? 0.45 : 1;
      out += `<rect x="${sx}" y="${y-11}" width="${w-3}" height="23" rx="4"
              fill="${fill}" fill-opacity="${op}" stroke="#39405280"/>`;
      const label = tile ? (SHORT[tile.industry] + tile.level)
                         : slot.map(i2 => SHORT[i2][0]).join('');
      out += `<text x="${sx + (w-3)/2}" y="${y+3}" text-anchor="middle"
              ${tile ? '' : 'class="tname"'}>${label}</text>`;
      if (tile && tile.resources)
        out += `<circle cx="${sx+w-6}" cy="${y-8}" r="4" fill="#f0c674"/>
                <text x="${sx+w-6}" y="${y-5}" text-anchor="middle"
                style="font-size:7px;fill:#1a1d25">${tile.resources}</text>`;
    });
  }
  svg.innerHTML = out;

  document.getElementById('era').textContent =
    `${s.era} · round ${s.round}/${s.rounds_this_era}`;
  document.getElementById('market').textContent =
    `coal ${s.coal_market} · iron ${s.iron_market}`;

  document.getElementById('seats').innerHTML = s.players.map(p => `
    <div class="seat ${p.idx === s.seat ? 'me' : ''} ${p.idx === s.current ? 'turn' : ''}">
      <span><span class="dot" style="background:${COL[p.idx]}"></span>
      ${p.idx === s.seat ? 'You' : 'Bot ' + p.idx}
      ${p.idx === s.current ? ' ←' : ''}</span>
      <span>${p.vp} VP · £${p.money} · inc ${p.income}</span>
    </div>`).join('');

  document.getElementById('hand').innerHTML = s.hand.map(c =>
    `<span class="chip">${c.town || (c.industries.length ? c.industries.map(i => SHORT[i]).join('/') : c.kind)}</span>`
  ).join('') || '<span class="empty">empty</span>';

  const kinds = ['All', ...new Set(s.moves.map(m => m.kind))];
  document.getElementById('filters').innerHTML = kinds.map(k =>
    `<button class="${k === filter ? 'sel' : ''}" onclick="setFilter('${k}')">${k}</button>`
  ).join('');
  document.getElementById('movecount').textContent = s.moves.length;

  const box = document.getElementById('moves');
  if (s.finished) {
    box.innerHTML = `<p><strong>Game over.</strong> Winner: seat ${s.winners.join(', ')}<br>` +
      s.players.map(p => `seat ${p.idx}: ${p.vp}`).join(' · ') + '</p>';
  } else if (!s.moves.length) {
    box.innerHTML = '<p class="empty">Bots are thinking…</p>';
  } else {
    box.innerHTML = s.moves.filter(m => filter === 'All' || m.kind === filter)
      .map(m => `<button class="move" onclick="play(${m.index})">${m.text}</button>`).join('');
  }
  document.getElementById('log').innerHTML =
    s.log.slice().reverse().map(l => `<div>${l}</div>`).join('');
}

function setFilter(k) { filter = k; draw(S); }
function play(i) {
  document.getElementById('moves').innerHTML = '<p class="empty">Playing…</p>';
  post('/api/move', {index: i});
}
fetch('/api/state').then(r => r.json()).then(draw);
</script>
