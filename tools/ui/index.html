<!doctype html>
<meta charset="utf-8">
<title>BrassBot</title>
<style>
  :root {
    --bg:#12141a; --panel:#1a1d25; --line:#2b303c; --text:#e6e8ee;
    --dim:#8b93a7; --accent:#e0a458;
    --p0:#4da3ff; --p1:#e05c5c; --p2:#5fc98a; --p3:#c88ce0;
  }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--text);
         font:14px/1.45 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
         display:grid; grid-template-columns:minmax(0,1fr) 380px; height:100vh }
  #board { padding:10px; overflow:auto }
  aside { background:var(--panel); border-left:1px solid var(--line);
          overflow-y:auto; padding:14px }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em;
       color:var(--dim); margin:18px 0 8px; font-weight:600 }
  h2:first-child { margin-top:0 }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap }
  .chip { background:#232733; border:1px solid var(--line); border-radius:6px;
          padding:3px 8px; font-size:12px }
  .seat { display:flex; justify-content:space-between; padding:6px 8px;
          border-radius:6px; border:1px solid var(--line); margin-bottom:5px }
  .seat.me { border-color:var(--accent) }
  .seat.turn { background:#232733 }
  .dot { width:9px; height:9px; border-radius:50%; display:inline-block;
         margin-right:6px; vertical-align:middle }
  button { font:inherit; background:#232733; color:var(--text);
           border:1px solid var(--line); border-radius:6px; padding:6px 10px;
           cursor:pointer }
  button:hover { border-color:var(--accent) }
  button.sel { background:var(--accent); color:#1a1d25; border-color:var(--accent) }
  .move { display:block; width:100%; text-align:left; margin-bottom:4px;
          font-size:12.5px; white-space:normal }
  .empty { color:var(--dim); font-style:italic }
  text { font:600 10px ui-sans-serif,system-ui,sans-serif; fill:var(--text);
         pointer-events:none }
  .tname { font-size:9px; fill:var(--dim) }
  #log div { font-size:12px; color:var(--dim); padding:2px 0;
             border-bottom:1px solid #20242e }
  /* The mat is the thing a Brass player plans around -- you always build the
     LOWEST level you still hold -- and the first version of this UI did not
     show it at all. */
  .mat { display:grid; grid-template-columns:auto 1fr auto; gap:2px 8px;
         align-items:center; font-size:12px }
  .mat .ind { color:var(--dim) }
  .mat .lv { font-weight:600 }
  .mat .meta { color:var(--dim); font-size:11px; text-align:right }
  .pips { display:flex; gap:2px }
  .pip { width:7px; height:12px; border-radius:2px; background:#2b303c }
  .pip.have { background:#4a5364 }
  .pip.next { background:var(--accent) }
  .warn { color:#e0a458 }
  .gone { color:#e05c5c }
  .bar { height:6px; background:#2b303c; border-radius:3px; overflow:hidden;
         min-width:70px; flex:1 }
  .bar > i { display:block; height:100%; background:var(--accent) }
  .mkt { display:flex; align-items:center; gap:8px; font-size:12px;
         margin-bottom:4px }
  .seat small { color:var(--dim) }
  .move.hi { border-color:var(--accent) }
  /* Cards first. Brass is played by choosing a card and then seeing what it
     allows -- a flat list of 100 move strings is not a decision anyone can
     make. */
  .cards { display:flex; flex-wrap:wrap; gap:6px }
  .card { min-width:74px; padding:6px 8px; border-radius:7px; cursor:pointer;
          background:#232733; border:1px solid var(--line); text-align:left }
  .card:hover { border-color:var(--accent) }
  .card.sel { border-color:var(--accent); background:#2c3040 }
  .card.dead { opacity:.4; cursor:not-allowed }
  .card b { display:block; font-size:12.5px }
  .card span { font-size:10.5px; color:var(--dim) }
  .kinds { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 }
  .kind { padding:5px 10px; border-radius:6px; cursor:pointer; font-size:12.5px;
          background:#232733; border:1px solid var(--line) }
  .kind.sel { background:var(--accent); color:#1a1d25; border-color:var(--accent) }
  select { font:inherit; background:#232733; color:var(--text); padding:5px 8px;
           border:1px solid var(--line); border-radius:6px; width:100% }
  .hint { color:var(--dim); font-size:11.5px; margin:4px 0 8px }
  .lvl { display:inline-block; min-width:17px; padding:0 4px; border-radius:4px;
         background:#39405a; font-size:10.5px; font-weight:700; margin-right:5px }
</style>
<div id="board"><svg id="svg" viewBox="0 0 1000 820"></svg></div>
<aside>
  <div class="row" style="margin-bottom:6px">
    <strong style="font-size:16px">BrassBot</strong>
    <span class="chip" id="era"></span>
    <span class="chip" id="market"></span>
  </div>
  <h2>Markets</h2><div id="markets"></div>
  <h2>Players</h2><div id="seats"></div>
  <h2>Your mat &mdash; next tile of each industry</h2><div class="mat" id="mat"></div>
  <h2>Your hand <span id="movecount" class="chip"></span></h2>
  <div class="cards" id="hand"></div>
  <div id="kinds" class="kinds"></div>
  <div id="moves"></div>
  <h2>Recent</h2><div id="log"></div>
</aside>
<script>
const COL = ['var(--p0)','var(--p1)','var(--p2)','var(--p3)'];
const SHORT = {coal_mine:'CO', iron_works:'IR', brewery:'BR',
               cotton_mill:'CT', manufacturer:'MF', pottery:'PO'};
const NAME = {coal_mine:'coal mine', iron_works:'iron works', brewery:'brewery',
              cotton_mill:'cotton mill', manufacturer:'manufactured goods',
              pottery:'pottery'};

// Industry icons, drawn in a 24x24 box. Two-letter codes made the board a
// puzzle to read: CO/CT and MF/PO are one glyph apart, and nothing about "MF"
// suggests manufactured goods. A silhouette is recognisable at 14px where a
// pair of letters is not.
const ICON = {
  // a cut face of coal
  coal_mine: 'M4 17 L8 7 L15 5 L21 11 L19 19 L9 20 Z',
  // an anvil
  iron_works: 'M3 9 h7 l2 2 h9 v3 q-4 0 -6 3 l-1 3 h-6 l1 -3 q-3 -2 -6 -2 z',
  // a barrel, on its side, with hoops
  brewery: 'M5 6 q7 -2 14 0 q2 6 0 12 q-7 2 -14 0 q-2 -6 0 -12 z '
         + 'M9 5 v14 M15 5 v14',
  // a bobbin of thread
  cotton_mill: 'M6 4 h12 v2 h-3 v12 h3 v2 h-12 v-2 h3 v-12 h-3 z '
             + 'M9 8 h6 M9 12 h6 M9 16 h6',
  // a gear
  manufacturer: 'M12 4 l2 0 l1 2.5 l2 1 l2.5 -1 l1.4 1.4 l-1 2.5 l1 2 l2.5 1 '
              + 'l0 2 l-2.5 1 l-1 2 l1 2.5 l-1.4 1.4 l-2.5 -1 l-2 1 l-1 2.5 '
              + 'l-2 0 l-1 -2.5 l-2 -1 l-2.5 1 l-1.4 -1.4 l1 -2.5 l-1 -2 '
              + 'l-2.5 -1 l0 -2 l2.5 -1 l1 -2 l-1 -2.5 l1.4 -1.4 l2.5 1 '
              + 'l2 -1 z M12 9 a3 3 0 1 0 0.1 0 z',
  // a vase
  pottery: 'M9 3 h6 v2 l-1 2 q4 3 4 7 q0 5 -6 7 q-6 -2 -6 -7 q0 -4 4 -7 l-1 -2 z',
};

function icon(ind, x, y, size, fill, opacity) {
  const s = size / 24;
  return `<g transform="translate(${x},${y}) scale(${s})"
           fill="${fill}" fill-opacity="${opacity == null ? 1 : opacity}"
           stroke="${fill}" stroke-opacity="${(opacity == null ? 1 : opacity) * 0.9}"
           stroke-width="1.1" stroke-linejoin="round" pointer-events="none">
           <path d="${ICON[ind]}"/></g>`;
}
let S = null, card = null, kind = null;
const MATNAME = {coal_mine:'coal', iron_works:'iron', brewery:'brewery',
                 cotton_mill:'cotton', manufacturer:'manuf.', pottery:'pottery'};

const post = (url, body) => fetch(url, {method:'POST',
  headers:{'Content-Type':'application/json'}, body:JSON.stringify(body||{})})
  .then(r => r.json()).then(draw);

function draw(s) {
  S = s;
  const C = s.coords, svg = document.getElementById('svg');
  let out = '';

  // links: every line on the board, built ones in their owner's colour
  const built = {};
  s.links.forEach(l => built[l.id] = l.owner);
  // A link is not always a line between two points: kidderminster-worcester
  // -farm_southern joins three locations, so draw spokes from the centroid.
  const spokes = (ends, stroke, w, dash) => {
    const cx = ends.reduce((a,e)=>a+C[e][0],0)/ends.length;
    const cy = ends.reduce((a,e)=>a+C[e][1],0)/ends.length;
    return ends.map(e => `<line x1="${C[e][0]}" y1="${C[e][1]}" x2="${cx}" y2="${cy}"
      stroke="${stroke}" stroke-width="${w}" stroke-linecap="round"
      ${dash ? 'stroke-dasharray="5 5"' : ''}/>`).join('');
  };
  for (const l of (s.all_links || []))
    if (!(l.id in built)) out += spokes(l.ends, '#2c3242', 2, true);
  for (const l of s.links) out += spokes(l.ends, COL[l.owner], 4, false);

  // merchants
  for (const m of s.all_merchants) {
    const [x, y] = C[m];
    const live = s.merchants[m];
    out += `<rect x="${x-52}" y="${y-22}" width="104" height="44" rx="9"
            fill="#242938" stroke="${live ? 'var(--accent)' : '#333a4a'}"/>
            <text x="${x}" y="${y-8}" text-anchor="middle">${m}</text>`;
    if (live) {
      // Each slot: what it takes, and whether its beer barrel is still there.
      const sw = 30, tot = live.length * sw;
      live.forEach((sl, j) => {
        const gx = x - tot/2 + j*sw;
        if (sl.kind === 'blank')
          out += `<text x="${gx+11}" y="${y+11}" text-anchor="middle"
                   class="tname">—</text>`;
        else if (sl.kind === 'any')
          out += `<text x="${gx+11}" y="${y+11}" text-anchor="middle"
                   style="font-size:9px;font-weight:700;fill:var(--accent)">ANY</text>`;
        else
          out += icon(sl.kind, gx + 3, y - 2, 15, '#c9d1e0', 0.95);
        // The barrel is the thing that decides whether a sale is possible.
        out += sl.beer
          ? `<circle cx="${gx+22}" cy="${y+3}" r="5" fill="#e0a458"
              stroke="#12141a" stroke-width="0.8"><title>beer available</title></circle>`
          : `<circle cx="${gx+22}" cy="${y+3}" r="5" fill="none"
              stroke="#4a5364" stroke-dasharray="2 2"><title>beer gone</title></circle>`;
      });
    } else {
      out += `<text x="${x}" y="${y+10}" text-anchor="middle" class="tname">unused</text>`;
    }
  }

  // Towns: one box per industry slot. A built tile shows its industry as an
  // icon with the level as a corner badge; an EMPTY slot shows faint icons of
  // what may be built there, which the two-letter version could not do at all
  // (a slot taking coal or iron rendered as "CI").
  const at = {};
  s.tiles.forEach(t => at[t.town + ':' + t.slot] = t);
  for (const t of s.towns) {
    const [x, y] = C[t.id], n = t.slots.length, w = 32, total = n * w;
    out += `<text x="${x}" y="${y-20}" text-anchor="middle" class="tname">${t.name}</text>`;
    t.slots.forEach((slot, i) => {
      const sx = x - total/2 + i*w, bw = w - 4, tile = at[t.id + ':' + i];
      if (tile) {
        // Unflipped tiles are drawn hollow: the tile is on the board but has
        // not scored, which is the distinction that decides most of the game.
        const c = COL[tile.owner], flipped = tile.flipped;
        out += `<rect x="${sx}" y="${y-13}" width="${bw}" height="27" rx="5"
                fill="${flipped ? c : 'transparent'}" fill-opacity="${flipped ? 1 : 0}"
                stroke="${c}" stroke-width="${flipped ? 1 : 2}"
                stroke-dasharray="${flipped ? '' : '3 2'}"/>`;
        out += icon(tile.industry, sx + bw/2 - 8, y - 10, 17,
                    flipped ? '#12141a' : c, flipped ? 0.85 : 1);
        out += `<text x="${sx+bw-4}" y="${y+12}" text-anchor="end"
                style="font-size:9px;font-weight:700;fill:${flipped ? '#12141a' : c}"
                >${tile.level}</text>`;
        out += `<title>${NAME[tile.industry]} L${tile.level}, seat ${tile.owner}`
             + `${flipped ? ' — flipped' : ' — NOT flipped, scores nothing yet'}</title>`;
        if (tile.resources)
          out += `<circle cx="${sx+bw-5}" cy="${y-10}" r="5.5" fill="#f0c674"
                   stroke="#12141a" stroke-width="0.8"/>
                  <text x="${sx+bw-5}" y="${y-7}" text-anchor="middle"
                   style="font-size:8px;font-weight:700;fill:#1a1d25"
                   >${tile.resources}</text>`;
      } else {
        out += `<rect x="${sx}" y="${y-13}" width="${bw}" height="27" rx="5"
                fill="#1a1e28" stroke="#2b303c"/>`;
        const k = slot.length, isize = k > 2 ? 11 : 13;
        slot.forEach((ind, j) => {
          const ix = sx + bw/2 - (k * isize) / 2 + j * isize;
          out += icon(ind, ix, y - isize/2, isize, '#6d7688', 0.75);
        });
        out += `<title>${slot.map(i2 => NAME[i2]).join(' or ')}</title>`;
      }
    });
  }
  svg.innerHTML = out;

  document.getElementById('era').textContent =
    `${s.era} · round ${s.round}/${s.rounds_this_era}`;
  document.getElementById('market').textContent =
    `coal ${s.coal_market} · iron ${s.iron_market}`;

  // Banked VP is near zero for everyone through the Canal Era, so the raw
  // number tells you nothing about where you stand. The projected figure is
  // what to read; it is shown in brackets.
  document.getElementById('seats').innerHTML = s.players
    .slice().sort((a,b) => (a.order ?? 9) - (b.order ?? 9)).map(p => `
    <div class="seat ${p.idx === s.seat ? 'me' : ''} ${p.idx === s.current ? 'turn' : ''}">
      <span><span class="dot" style="background:${COL[p.idx]}"></span>
      ${p.idx === s.seat ? 'You' : 'Bot ' + p.idx}
      ${p.idx === s.current ? ' ←' : ''}
      <small>&nbsp;#${(p.order ?? 0) + 1} · spent £${p.spent}</small></span>
      <span><strong>${p.projected}</strong> <small>(${p.vp} banked)</small>
      · £${p.money} · inc ${p.income} · ${p.links_left} links</span>
    </div>`).join('');

  // Markets: the PRICE is the number you reason with, not the cube count, and
  // a mine or works built into a short market sells its cubes on placement.
  const mkt = (name, held, cap, price) => {
    const pct = Math.round(100 * held / cap);
    const note = held === 0 ? '<span class="gone">empty — builds sell out</span>'
               : held <= 3 ? '<span class="warn">short</span>' : '';
    return `<div class="mkt"><span style="width:34px">${name}</span>
      <span class="bar"><i style="width:${pct}%"></i></span>
      <span>${held}/${cap} · £${price}</span> ${note}</div>`;
  };
  document.getElementById('markets').innerHTML =
    mkt('coal', s.coal_market, s.coal_cap, s.coal_price) +
    mkt('iron', s.iron_market, s.iron_cap, s.iron_price);

  // The mat: what a Build would actually place for each industry.
  document.getElementById('mat').innerHTML = Object.entries(s.mat).map(([ind, m]) => {
    if (m.next === null) return `<span class="ind">${MATNAME[ind]}</span>
        <span class="gone">exhausted</span><span></span>`;
    const pips = m.by_level.map((n, i) => {
      const lvl = i + 1;
      const cls = n === 0 ? '' : (lvl === m.next ? 'pip next' : 'pip have');
      return `<span class="${cls || 'pip'}" title="L${lvl}: ${n} left"></span>`;
    }).join('');
    const flags = (m.canal_only ? ' <span class="warn" title="canal only — removed at the boundary whether it flipped or not">canal-only</span>' : '')
                + (m.rail_only ? ' <span class="warn">rail-only</span>' : '');
    const beer = m.beer ? ` · ${m.beer} beer` : (m.beer === 0 ? ' · no beer' : '');
    return `<span class="ind">${MATNAME[ind]}</span>
      <span><span class="lv">L${m.next}</span> <span class="pips">${pips}</span>${flags}</span>
      <span class="meta">£${m.cost}${m.coal ? '+' + m.coal + 'c' : ''}${m.iron ? '+' + m.iron + 'i' : ''}
        · ${m.vp}vp${beer}</span>`;
  }).join('');

  // --- hand -> action type -> choice ------------------------------------
  // Cards carry a count of what they can actually do, so a dead card is
  // visibly dead instead of being something you click and find empty.
  const byCard = {};
  s.moves.forEach(m => (byCard[m.card] = byCard[m.card] || []).push(m));
  if (card !== null && !byCard[card]) card = null;

  const cardLabel = c => c.town ? c.town.replace(/_/g, ' ')
      : (c.industries && c.industries.length
         ? c.industries.map(i => MATNAME[i] || i).join(' / ')
         : c.kind.replace(/_/g, ' '));

  document.getElementById('hand').innerHTML = s.hand.map((c, i) => {
    const n = (byCard[i] || []).length;
    return `<button class="card ${i === card ? 'sel' : ''} ${n ? '' : 'dead'}"
      ${n ? `onclick="pickCard(${i})"` : 'disabled'}>
      <b>${cardLabel(c)}</b><span>${n ? n + ' move' + (n === 1 ? '' : 's') : 'no moves'}</span>
    </button>`;
  }).join('') || '<span class="empty">no cards</span>';
  document.getElementById('movecount').textContent = s.moves.length + ' moves';

  const KINDLABEL = {Build:'Build', Network:'Link', Develop:'Develop',
                     Sell:'Sell', Loan:'Loan', Scout:'Scout', Pass:'Pass'};
  const kbox = document.getElementById('kinds'), box = document.getElementById('moves');

  if (s.finished) {
    kbox.innerHTML = '';
    box.innerHTML = `<p><strong>Game over.</strong> Winner: seat ${s.winners.join(', ')}<br>` +
      s.players.map(p => `seat ${p.idx}: ${p.vp}`).join(' · ') + '</p>';
  } else if (!s.moves.length) {
    kbox.innerHTML = '';
    box.innerHTML = '<p class="empty">Bots are thinking…</p>';
  } else if (card === null) {
    kbox.innerHTML = '';
    box.innerHTML = '<p class="hint">Pick a card above to see what it lets you do.</p>';
  } else {
    const mine = byCard[card];
    const kinds = [...new Set(mine.map(m => m.kind))];
    if (kind !== null && !kinds.includes(kind)) kind = null;
    kbox.innerHTML = kinds.map(k => {
      const n = mine.filter(m => m.kind === k).length;
      return `<button class="kind ${k === kind ? 'sel' : ''}"
        onclick="pickKind('${k}')">${KINDLABEL[k] || k} <small>${n}</small></button>`;
    }).join('');

    if (kind === null) {
      box.innerHTML = '<p class="hint">Now choose what to do with it.</p>';
    } else {
      const opts = mine.filter(m => m.kind === kind);
      box.innerHTML = renderKind(kind, opts, s);
    }
  }

  document.getElementById('log').innerHTML = s.log.slice().reverse().map(l =>
    `<div><span class="dot" style="background:${COL[l.seat]}"></span>
     <span style="color:${l.seat === s.seat ? 'var(--accent)' : 'var(--dim)'}">
     ${l.seat === s.seat ? 'You' : 'Bot ' + l.seat}</span> ${l.text}</div>`).join('');
}

// Hovering a move rings the town it happens at. Reading a move like
// "BUILD coal_mine L1 at coalbrookdale" and then hunting the board for
// Coalbrookdale is the slowest part of using this.
function hi(town) {
  const old = document.getElementById('hl'); if (old) old.remove();
  if (!town || !S || !S.coords[town]) return;
  const [x, y] = S.coords[town];
  document.getElementById('svg').insertAdjacentHTML('beforeend',
    `<circle id="hl" cx="${x}" cy="${y}" r="34" fill="none"
     stroke="var(--accent)" stroke-width="2.5" opacity="0.9"/>`);
}
// Develop is the action that most needs collapsing: it offers every
// combination of one or two industries, which was 20 near-identical strings.
// Two dropdowns say the same thing in one line, and show the LEVEL each
// choice would remove -- the number that actually matters, since developing
// clears the lowest tile you hold.
function renderKind(kind, opts, s) {
  if (kind === 'Develop') {
    const one = opts.filter(m => m.industries.length === 1);
    const two = opts.filter(m => m.industries.length === 2);
    const label = m => m.industries.map((ind, j) =>
      `${MATNAME[ind] || ind} L${m.levels[j]}`).join('  +  ');
    const sel = (list, id, note) => list.length ? `
      <p class="hint">${note}</p>
      <div class="row" style="margin-bottom:10px">
        <select id="${id}">${list.map(m =>
          `<option value="${m.index}">${label(m)}</option>`).join('')}</select>
        <button onclick="play(+document.getElementById('${id}').value)">Develop</button>
      </div>` : '';
    return sel(one, 'dev1', 'Remove one tile (1 iron):')
         + sel(two, 'dev2', 'Remove two tiles in one action (1 iron each):');
  }

  if (kind === 'Build') {
    // Grouped by industry, with the level shown as a badge -- you always build
    // the lowest level you still hold, so the level is not a choice and should
    // not read like one.
    const g = {};
    opts.forEach(m => (g[m.industry] = g[m.industry] || []).push(m));
    return Object.entries(g).map(([ind, list]) => `
      <p class="hint" style="margin-top:10px">
        <span class="lvl">L${list[0].level}</span>${NAME[ind]}</p>` +
      list.map(m => btn(m, m.text.replace(/^BUILD [a-z_]+ L\d+ at /, '')))
          .join('')).join('');
  }

  if (kind === 'Network') {
    const dbl = opts.filter(m => m.double), single = opts.filter(m => !m.double);
    return (dbl.length ? `<p class="hint">Double rail — two links for one action</p>`
                       + dbl.map(m => btn(m, m.text.replace(/^NETWORK \w+: /, ''))).join('') : '')
         + (single.length ? `<p class="hint" style="margin-top:8px">Single link</p>`
                       + single.map(m => btn(m, m.text.replace(/^NETWORK \w+: /, ''))).join('') : '');
  }

  if (kind === 'Sell') {
    const g = {own: [], merchant: []};
    opts.forEach(m => g[m.own_beer ? 'own' : 'merchant'].push(m));
    const part = (list, note) => list.length
      ? `<p class="hint" style="margin-top:8px">${note}</p>`
        + list.map(m => btn(m, `${m.tiles} tile${m.tiles === 1 ? '' : 's'} — `
            + m.sales.map(x => x.town.replace(/_/g,' ') + ' → ' + x.merchant).join(', '))).join('')
      : '';
    // Spending your own barrels flips your own breweries, which is 5-10 VP
    // and scores twice in the Canal Era; a merchant's beer is free and carries
    // a bonus. Neither is always right, so both are offered plainly.
    return part(g.merchant, "Merchant's beer first — free, and carries the merchant bonus")
         + part(g.own, 'Your own beer first — flips your own breweries');
  }

  return opts.map(m => btn(m, m.text)).join('');
}

function btn(m, text) {
  const town = (m.town || (m.text.match(/at ([a-z_]+)/) || [])[1] || '');
  return `<button class="move" onclick="play(${m.index})"
    onmouseenter="hi('${town}')" onmouseleave="hi('')">${text}</button>`;
}

function pickCard(i) { card = (card === i ? null : i); kind = null; draw(S); }
function pickKind(k) { kind = (kind === k ? null : k); draw(S); }
function play(i) {
  document.getElementById('moves').innerHTML = '<p class="empty">Playing…</p>';
  card = null; kind = null;
  post('/api/move', {index: i});
}
fetch('/api/state').then(r => r.json()).then(draw);
</script>
