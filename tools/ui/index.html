    if (dev2 && !partners.includes(dev2)) dev2 = null;

    const chosen = byKey[key([dev1, dev2].filter(Boolean))];
    const opt = (v, cur, txt) =>
      `<option value="${v}" ${v === cur ? 'selected' : ''}>${txt}</option>`;
    const lvl = i => chosen && chosen.levels[i] != null ? ` L${chosen.levels[i]}` : '';
    const order = chosen ? chosen.industries : [];
    const lvlOf = ind => {
      const i = order.indexOf(ind);
      return i < 0 ? '' : lvl(i);
    };

    return `<p class="hint">Pick what to remove. One slot develops one tile,
      both develop two — 1 iron each.</p>
      <div class="row" style="gap:6px;margin-bottom:9px">
        <select onchange="setDev(1, this.value)">
          ${opt('', dev1 || '', '— first —')}
          ${all.map(i => opt(i, dev1 || '', (MATNAME[i] || i))).join('')}
        </select>
        <span class="meta">${dev1 ? (MATNAME[dev1] || dev1) + lvlOf(dev1) : ''}</span>
        <select onchange="setDev(2, this.value)" ${dev1 ? '' : 'disabled'}>
          ${opt('', dev2 || '', partners.length ? '— none —' : '— none available —')}
          ${partners.map(i => opt(i, dev2 || '', (MATNAME[i] || i))).join('')}
        </select>
        <span class="meta">${dev2 ? (MATNAME[dev2] || dev2) + lvlOf(dev2) : ''}</span>
      </div>
      ${chosen
        ? btn(chosen, `Develop ${chosen.industries.length === 2 ? '2 tiles' : '1 tile'}`, s)
        : '<p class="hint">Choose an industry for the first slot.</p>'}`;
  }

  if (kind === 'Build') {
    // Grouped by industry, with the level shown as a badge -- you always build
    // the lowest level you still hold, so the level is not a choice and should
    // not read like one.
    const g = {};
    if (bind !== null && opts.some(m => m.industry === bind))
      opts = opts.filter(m => m.industry === bind);
    opts.forEach(m => (g[m.industry] = g[m.industry] || []).push(m));
    const inds = Object.keys(g);
    // More than one industry on offer: ask which, and only then where. Each
    // chip carries how many towns it opens, so the choice is informed. The
    // map narrows with it.
    if (inds.length > 1 && bind === null)
      return `<p class="hint">This card can build ${inds.length} industries. Which?</p>
        <div class="kinds">${inds.map(ind => `
          <button class="kind" onclick="pickInd('${ind}')">
            <svg width="15" height="15" viewBox="0 0 17 17" style="vertical-align:-3px"
              >${icon(ind, 1, 1, 15, ICOL[ind] || 'var(--dim)', 1)}</svg>
            <span class="lvl">L${g[ind][0].level}</span>${NAME[ind]}
            <small class="meta">${g[ind].length} town${g[ind].length === 1 ? '' : 's'}</small>
          </button>`).join('')}</div>`;
    const back = bind !== null
      ? `<p class="hint"><button class="tbtn" onclick="pickInd(null)">← other industries</button>
         Click a highlighted town, or choose below.</p>` : '';
    return back + Object.entries(g).map(([ind, list]) => `
      <p class="hint" style="margin-top:10px">
        <span class="lvl">L${list[0].level}</span>${NAME[ind]}</p>` +
      list.map(m => {
        // Two slots in one town accept the same industry, so the prose alone
        // renders two identical buttons. Name the slot when that happens.
        const dupe = list.filter(o => o.town === m.town).length > 1;
        const town = (s.towns.find(t => t.id === m.town) || {}).name || m.town;
        return btn(m, town + (dupe ? ` <small>slot ${m.slot + 1}</small>` : ''), s);
      }).join('')).join('');
  }

  if (kind === 'Network') {
    const dbl = opts.filter(m => m.double), single = opts.filter(m => !m.double);
    const label = m => (m.pretty || m.text).replace(/^linked /, '').replace(/ · card.*$/, '');
    // With a first line chosen, the one thing to say is what the second click
    // does. The single stays as a button, the pairs stay as a list for anyone
    // who would rather read the prices than hunt the map.
    if (focus && single.length && dbl.length)
      return `<p class="hint"><b>${focus.replace(/[-_]/g, ' ')}</b> is your first link.
          Click a second highlighted link to build both, or:</p>`
        + single.map(m => btn(m, 'just ' + label(m), s)).join('')
        + `<p class="hint" style="margin-top:8px">${dbl.length} pairs with it</p>`
        + dbl.map(m => btn(m, label(m), s)).join('');
    return (dbl.length ? `<p class="hint">Double rail — two links for one action.
          Click a link on the map, then its partner.</p>`
                       + dbl.map(m => btn(m, label(m), s)).join('') : '')
         + (single.length ? `<p class="hint" style="margin-top:8px">Single link</p>`
                       + single.map(m => btn(m, label(m), s)).join('') : '');
  }

  if (kind === 'Scout') {
    // Scout discards THREE cards: the one played, plus two you choose. Every
    // option rendered as the same sentence before, so the choice the rules give
    // you was on screen as twenty identical lines.
    // All three cards are discarded, so which one the engine calls "the card"
    // is arbitrary -- it names the most expendable of each triple. Filtering on
    // that left a valuable card with one option or none, when what matters is
    // the SET of three. Any triple containing your card qualifies.
    const pairKey = a => a.slice().sort((x, y) => x - y).join('|');
    const triple = m => [m.card, ...m.extra];
    const withCard = (s.moves || [])
      .filter(m => m.kind === 'Scout' && triple(m).some(i => sigAt(i) === sigAt(card)));
    // Drop ONE index matching the chosen card, not every copy of its face: a
    // triple may legitimately hold both of your two identical cards.
    const others = m => {
      const t = triple(m), j = t.findIndex(i => sigAt(i) === sigAt(card));
      return t.filter((_, k) => k !== j);
    };
    const byPair = {};
    withCard.forEach(m => byPair[pairKey(others(m))] = m);
    const firsts = [...new Set(withCard.flatMap(others))].sort((a, b) => a - b);
    if (sc1 !== null && !firsts.includes(sc1)) { sc1 = null; sc2 = null; }
    const partners = sc1 === null ? [] : [...new Set(withCard
      .filter(m => others(m).includes(sc1))
      .flatMap(m => others(m).filter(x => x !== sc1)))].sort((a, b) => a - b);
    if (sc2 !== null && !partners.includes(sc2)) sc2 = null;

    const nm = i => cardLabel(s.hand[i]);
    const pick = (sc1 !== null && sc2 !== null) ? byPair[pairKey([sc1, sc2])] : null;
    const optTag = (v, cur, txt) =>
      `<option value="${v}" ${String(v) === String(cur) ? 'selected' : ''}>${txt}</option>`;

    return `<p class="hint">Scouting spends three cards — the one you played,
      plus two more — and gives you a wild location and a wild industry.
      Giving up: <b>${cardLabel(s.hand[card])}</b>.</p>
      <div class="row" style="gap:6px;margin-bottom:9px">
        <select onchange="setScout(1, this.value)">
          ${optTag('', sc1 === null ? '' : sc1, '— second card —')}
          ${firsts.map(i => optTag(i, sc1, nm(i))).join('')}
        </select>
        <select onchange="setScout(2, this.value)" ${sc1 === null ? 'disabled' : ''}>
          ${optTag('', sc2 === null ? '' : sc2, '— third card —')}
          ${partners.map(i => optTag(i, sc2, nm(i))).join('')}
        </select>
      </div>
      ${pick ? btn(pick, `Scout — give up ${cardLabel(s.hand[card])}, `
                        + `${nm(sc1)}, ${nm(sc2)}`, s)
             : '<p class="hint">Choose the two other cards to discard.</p>'}`;
  }

  if (kind === 'Sell') {
    const g = {own: [], merchant: []};
    opts.forEach(m => g[m.own_beer ? 'own' : 'merchant'].push(m));
    const part = (list, note) => list.length
      ? `<p class="hint" style="margin-top:8px">${note}</p>`
        + list.map(m => btn(m, `${m.tiles} tile${m.tiles === 1 ? '' : 's'} — `
            + m.sales.map(x => (TOWNNAME[x.town] || x.town) + ' → ' + x.merchant
                + (PERK[x.merchant] ? ` <b>${PERK[x.merchant]}</b>` : ''))
                     .join(', '), s)).join('')
      : '';
    // Spending your own barrels flips your own breweries, which is 5-10 VP
    // and scores twice in the Canal Era; a merchant's beer is free and carries
    // a bonus. Neither is always right, so both are offered plainly.
    return part(g.merchant, "Merchant's beer first — free, and carries the merchant bonus")
         + part(g.own, 'Your own beer first — flips your own breweries');
  }

  return opts.map(m => btn(m, (m.pretty || m.text)
      .replace(/ · card.*$/, ''), s)).join('');
}

// Where each cube comes from, not just the total. "1 iron (market £5)" is a
// different decision from "1 iron (Coalbrookdale, yours)" -- one empties your
// pocket, the other flips a tile you own.
function costLine(m, s) {
  if (m.price === undefined) return '';
  const TN = {}; (s.towns || []).forEach(t => TN[t.id] = t.name);
  const src = d => d.kind === 'market' ? `market £${d.cost}`
             : d.kind === 'merchant_beer' ? `${TN[d.merchant] || d.merchant} merchant`
             : `${TN[d.town] || d.town}` + (d.owner === null || d.owner === undefined
                 ? '' : d.owner === s.seat ? ', yours' : `, Bot ${d.owner}`);
  const bits = (m.price ? [`£${m.price}`] : [])
    .concat((m.coal || []).map(d => `1 coal (${src(d)})`))
    .concat((m.iron || []).map(d => `1 iron (${src(d)})`))
    .concat((m.beer || []).map(d => `1 beer (${src(d)})`));
  if (!bits.length) return '';
  const tail = m.revenue
    ? ` = £${m.outlay} − £${m.revenue} sold = <b>£${m.net}</b>`
    : (bits.length > 1 ? ` = <b>£${m.outlay}</b>` : '');
  return `<span class="cost">${bits.join(' + ')}${tail}${
    m.overbuild ? ' · overbuild' : ''}</span>`;
}

function btn(m, text, s) {
  const town = (m.town || ((m.text || '').match(/at ([a-z_]+)/) || [])[1] || '');
  return `<button class="move" onclick="play(${m.index})"
    onmouseenter="hi('${town}')" onmouseleave="hi('')"
    >${text}${s ? costLine(m, s) : ''}</button>`;
}

function pickCard(i) {
  card = (card === i ? null : i); kind = null; focus = null; bind = null;
  dev1 = dev2 = null; sc1 = sc2 = null;
  draw(S);
}

// One delegated listener instead of an inline handler per target. event.target
// is the inner shape, never the group, so closest() is what resolves it.
(() => {
  const svg = document.getElementById('svg');
  const hit = e => e.target.closest && e.target.closest('[data-act]');
  svg.addEventListener('click', e => {
    const g = hit(e);
    if (g) (g.dataset.act === 'town' ? pickTown : pickLine)(g.dataset.id);
  });
  svg.addEventListener('mouseover', e => {
    const g = hit(e);
    if (g) showGhost(g.dataset.act, g.dataset.id);
  });
  svg.addEventListener('mouseout', e => { if (hit(e)) clearGhost(); });

  // Wheel zooms about the pointer. passive:false because the page must not
  // scroll underneath the board.
  const toBoard = e => {
    const r = svg.getBoundingClientRect();
    const scale = Math.max(view.w / r.width, view.h / r.height);
    return [view.x + (e.clientX - r.left - (r.width - view.w / scale) / 2) * scale,
            view.y + (e.clientY - r.top - (r.height - view.h / scale) / 2) * scale];
  };
  svg.addEventListener('wheel', e => {
    e.preventDefault();
    const [bx, by] = toBoard(e);
    zoomAt(e.deltaY > 0 ? 1.12 : 0.89, bx, by);
  }, {passive: false});

  // Drag pans. A click only counts as a click if the pointer barely moved, so
  // dragging across a target does not also play it.
  let drag = null;
  svg.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    drag = {x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, moved: 0};
  });
  svg.addEventListener('pointermove', e => {
    if (!drag) return;
    const r = svg.getBoundingClientRect();
    const scale = Math.max(view.w / r.width, view.h / r.height);
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag.moved = Math.max(drag.moved, Math.abs(dx) + Math.abs(dy));
    if (drag.moved < 4) return;
    view.x = drag.vx - dx * scale;
    view.y = drag.vy - dy * scale;
    applyView();   // clamps it back inside the board
  });
  const endDrag = () => { setTimeout(() => { drag = null; }, 0); };
  svg.addEventListener('pointerup', endDrag);
  svg.addEventListener('pointerleave', endDrag);
  svg.addEventListener('click', e => {
    if (drag && drag.moved >= 4) { e.stopPropagation(); }
  }, true);
  // Enter and Space must be wired by hand: role="button" describes an SVG
  // group, it does not make it behave like one.
  svg.addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const g = hit(e);
    if (!g) return;
    e.preventDefault();
    (g.dataset.act === 'town' ? pickTown : pickLine)(g.dataset.id);
  });
  svg.addEventListener('focusin', e => {
    const g = hit(e);
    if (g) showGhost(g.dataset.act, g.dataset.id);
  });
  // Without this, tabbing out of the board leaves the ghost and its cost
  // banner sitting over a target you are no longer on.
  svg.addEventListener('focusout', e => { if (hit(e)) clearGhost(); });
})();
// One option under the pointer plays immediately; several narrow the list and
// wait, because picking the slot or the sale is still a real choice.
function pickTown(t) {
  const ms = (S.moves || []).filter(m => sigAt(m.card) === sigAt(card)
      && m.kind === kind
      && (m.town === t || (m.sales || []).some(sa => sa.town === t)));
  if (ms.length === 1) play(ms[0].index);
  else { focus = t; draw(S); }
}
function pickLine(id) {
  const all = (S.moves || []).filter(m => sigAt(m.card) === sigAt(card)
      && m.kind === kind);
  const ms = all.filter(m => (m.lines || []).includes(id));
  if (kind === 'Network' && focus && ms.length) {
    // A first line is already chosen. The same line again lets go of it; a
    // different one plays the pair, which is the whole point of choosing.
    if (id === focus) { focus = null; draw(S); return; }
    const pair = all.find(m => (m.lines || []).length === 2
                            && m.lines.includes(focus) && m.lines.includes(id));
    if (pair) { play(pair.index); return; }
  }
  if (ms.length === 1) play(ms[0].index);
  else { focus = id; draw(S); }
}
function pickMat(i) { matSeat = i; draw(S); }
function pickInd(ind) { bind = ind; focus = null; draw(S); }
// --- hand arrangement ----------------------------------------------------
// Kept as display positions into the server's hand, reconciled each draw by
// card identity rather than index, because playing a card renumbers everything
// after it.
let handOrder = [], handSig = [], dragFrom = null;
const cardSig = c =>
  `${c.kind}|${c.town || ''}|${(c.industries || []).join(',')}`;

function reconcileHand(hand) {
  const sigs = hand.map(cardSig), used = hand.map(() => false), next = [];
  for (const sig of handSig) {
    const i = sigs.findIndex((x, j) => !used[j] && x === sig);
    if (i >= 0) { used[i] = true; next.push(i); }
  }
  hand.forEach((_, i) => { if (!used[i]) next.push(i); });
  handOrder = next;
  handSig = next.map(i => sigs[i]);
}

function dragCard(e, pos) {
  dragFrom = pos;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', String(pos));
  e.currentTarget.classList.add('drag');
}
function overCard(e, pos) {
  if (dragFrom === null || dragFrom === pos) return;
  e.preventDefault();
  e.currentTarget.classList.add('over');
}
function endCard(e) {
  dragFrom = null;
  document.querySelectorAll('.card.drag, .card.over')
    .forEach(el => el.classList.remove('drag', 'over'));
}
function dropCard(e, pos) {
  e.preventDefault();
  if (dragFrom === null || dragFrom === pos) return endCard(e);
  const moved = handOrder.splice(dragFrom, 1)[0];
  handOrder.splice(pos, 0, moved);
  handSig = handOrder.map(i => cardSig(S.hand[i]));
  endCard(e);
  draw(S);
}

function setScout(slot, v) {
  const n = v === '' ? null : +v;
  if (slot === 1) { sc1 = n; sc2 = null; } else { sc2 = n; }
  draw(S);
}
function setDev(slot, v) {
  if (slot === 1) { dev1 = v || null; dev2 = null; } else { dev2 = v || null; }
  draw(S);
}
function pickRes(k) { resFilter = (resFilter === k ? null : k); draw(S); }

// Ring one seat's tiles. This writes the fx layer directly rather than calling
// draw(), because rebuilding the whole board to answer "which are theirs?"
// would throw away focus and any ghost on every mouse move.
function hiSeat(seat) {
  // Its own layer: it used to share #lay-fx with the ghost, so hovering a seat
  // erased a keyboard ghost and left its cost banner describing a tile that was
  // no longer drawn.
  const fx = document.getElementById('lay-seat');
  if (!fx || !S) return;
  if (seat === null) { fx.innerHTML = ''; return; }
  const C = S.coords, byTown = {};
  for (const t of (S.tiles || []))
    if (t.owner === seat) (byTown[t.town] = byTown[t.town] || []).push(t);
  let g = '';
  for (const town in byTown) {
    const info = (S.towns || []).find(x => x.id === town);
    if (!info || !C[town]) continue;
    const [x, y] = C[town], w = 32, total = info.slots.length * w;
    for (const t of byTown[town]) {
      const sx = x - total/2 + t.slot*w;
      g += `<rect x="${sx-2}" y="${y-16}" width="${w-4+4}" height="33" rx="7"
             fill="none" stroke="${COL[seat]}" stroke-width="2"
             stroke-opacity="0.95"/>`;
    }
  }
  fx.innerHTML = g;
}
// The log's debug form gives net cost and income spaces; the prose form is what
// the exported file and the real Boomforge logs say. Both are useful, so both.
function toggleLog() { logProse = !logProse; draw(S); }

// Whether the results panel is shown or the final board is. Starts shown.
let resultsHidden = false;
function toggleResults() { resultsHidden = !resultsHidden; draw(S); }

// The end-of-game breakdown, players as columns in finishing order. Every
// figure comes from the server's summary, and the summary's era rows come
// from the engine's own scoring record, so nothing here is recomputed from
// the board and nothing can disagree with the log.
function renderResults(sum, s) {
  const seats = sum.seats.slice().sort((a, b) => a.rank - b.rank);
  const top = Math.max(...seats.map(x => x.vp));
  const cls = x => (x.idx === s.seat ? ' me' : '') + (x.vp === top && sum.finished ? ' win' : '');
  const row = (label, f, klass) =>
    `<tr class="${klass || ''}"><td>${label}</td>${
      seats.map(x => `<td class="${cls(x).trim()}">${f(x)}</td>`).join('')}</tr>`;
  const era = (x, e) => (x.eras.find(r => r.era === e) || null);
  const eraVp = (x, e) => { const r = era(x, e); return r ? r.industry_vp + r.link_vp : 0; };
  const built = x => `<span class="built">${Object.entries(x.built)
      .sort((a, b) => b[1] - a[1])
      .map(([k, v]) => `<span title="${NAME[k] || k}"><svg width="15" height="15"
        viewBox="0 0 17 17">${icon(k, 1, 1, 15, ICOL[k] || 'var(--dim)', 1)}</svg
        >${v}</span>`).join('')}</span>`;
  const A = {Build: 'B', Network: 'L', Develop: 'D', Sell: 'S', Loan: '£',
             Scout: 'Sc', Pass: 'P'};
  const acts = (x, e) => { const a = x.actions[e] || {}; return `<span class="amix">${
      Object.keys(A).filter(k => a[k]).map(k => `${A[k]}<b>${a[k]}</b>`).join(' ')
      || '<span class="meta">—</span>'}</span>`; };

  let h = `<button class="close" onclick="toggleResults()">Show the board</button>
    <h1>${sum.finished ? 'Game over' : 'Ended early'}${
      sum.winners.length ? ' · ' + sum.winners.join(' and ') + (sum.winners.length > 1 ? ' tie' : ' wins') : ''}</h1>
    <div class="sub">${sum.finished
      ? 'Both eras scored. Money is not victory points; income and then money break ties.'
      : 'Stopped before the Rail Era scored, so the rail figures below are banked VP only.'}</div>
    <table><thead><tr><th></th>${seats.map(x =>
      `<th class="${cls(x).trim()}"><span class="rk">#${x.rank}</span>
        <span class="dot" style="background:${COL[x.idx]}"></span>${x.name}</th>`).join('')}
    </tr></thead><tbody>`;
  h += row('Final VP', x => x.vp, 'total');
  for (const e of ['canal', 'rail']) {
    if (!seats.some(x => era(x, e))) continue;
    h += row(`${e} era`, x => eraVp(x, e), 'era');
    h += row('industries', x => era(x, e).industry_vp, 'part');
    h += row('links', x => era(x, e).link_vp, 'part');
    h += row('flipped · stranded', x => `${era(x, e).flipped} · <span class="${
      era(x, e).stranded ? 'warn' : ''}">${era(x, e).stranded}</span>`, 'part');
    h += row('links scored', x => era(x, e).links, 'part');
  }
  if (seats.some(x => x.bonus_vp))
    h += row('merchant bonuses', x => x.bonus_vp || '<span class="meta">0</span>', 'era');
  h += row('What was built', () => '', 'sect');
  h += row('industry tiles', built);
  h += row('links: canal · rail', x => `${x.links_built.canal} · ${x.links_built.rail}`);
  h += row('developed away', x => Object.values(x.developed).reduce((a, b) => a + b, 0)
                                  || '<span class="meta">0</span>');
  h += row('tiles sold', x => x.sold || '<span class="meta">0</span>');
  h += row('How the actions went', () => '', 'sect');
  h += row('canal era', x => acts(x, 'canal'));
  h += row('rail era', x => acts(x, 'rail'));
  h += row('loans', x => x.loans ? `<span class="warn">${x.loans}</span>` : '<span class="meta">0</span>');
  h += row('spent in total', x => '£' + x.spent);
  h += row('Where it ended', () => '', 'sect');
  h += row('income level', x => x.income);
  h += row('money in hand', x => '£' + x.money);
  h += `</tbody></table>
    <div class="meta" style="margin-top:10px">B build · L network · D develop · S sell
      · £ loan · Sc scout · P pass. Stranded: built and never flipped, scored nothing.</div>`;
  return h;
}
// Three states, because the honest answer to "big map without losing the hand"
// is that the window's height is fixed: the tray either takes the height or
// covers it. Overlaying is the middle one, and it is the one worth defaulting
// to -- the map is at full size and the hand is still under your cursor.
const FOLD = [
  {cls: [],                    label: '⤢ Big map',
   hint: 'give the map the whole window, with the hand floating over it (f)'},
  {cls: ['bigmap'],            label: '⤢ Map only',
   hint: 'slide the hand out of the way, so the bottom of the board is clear (f)'},
  {cls: ['bigmap', 'trayhid'], label: '⤡ Normal',
   hint: 'put the hand back under the board (f)'},
];
let foldAt = 0;
// The left rail's width, which the floating tray is positioned against and
// which CSS cannot read off a grid track.
function railWidths() {
  const l = document.getElementById('left');
  if (l) document.body.style.setProperty(
    '--railL', l.getBoundingClientRect().width + 'px');
}
addEventListener('resize', railWidths);

function foldTray(to) {
  foldAt = to == null ? (foldAt + 1) % FOLD.length : to;
  document.body.classList.remove('bigmap', 'trayhid');
  FOLD[foldAt].cls.forEach(c => document.body.classList.add(c));
  railWidths();
  const b = document.getElementById('foldbtn');
  // The button says what the NEXT press does, so it reads as an offer.
  if (b) { const next = FOLD[(foldAt + 1) % FOLD.length];
           b.textContent = FOLD[foldAt].label; b.title = FOLD[foldAt].hint; }
}
// Cheap enough to be worth a key, and you want it while looking at the board
// rather than while reaching for a button.
addEventListener('keydown', e => {
  if (e.key === 'f' && !/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))
    foldTray();
});
function toggleStack(ind) { matOpen[ind] = !matOpen[ind]; draw(S); }
// A tinted chip behind it, in the industry's own colour. At this size the
// silhouette alone is a smudge; the chip gives it an edge to be a shape against.
const matIcon = ind => ICON[ind]
  ? `<span class="mi" style="background:color-mix(in srgb, ${
      ICOL[ind]} 15%, transparent)"><svg width="17" height="17"
      viewBox="0 0 19 19">${icon(ind, 1, 1, 17, ICOL[ind], 1)}</svg></span>` : '';

// The viewBox lives on the <svg> itself, which draw() never rewrites -- only
// the layers inside it -- so zoom and pan survive every redraw for free.
const BASE_VIEW = {x: BOARD.x0 - MARGIN, y: BOARD.y0 - MARGIN,
                   w: BW + 2 * MARGIN, h: BH + 2 * MARGIN};
let view = {...BASE_VIEW};
// Zoomed all the way out IS the whole board, so there is nothing outside it to
// go to. The view is capped at the board's own box and kept inside it, which
// also means a pan cannot strand the map off screen: at full zoom-out the view
// is exactly the board and has nowhere left to slide.
function clampView() {
  view.w = Math.min(view.w, BASE_VIEW.w);
  view.h = Math.min(view.h, BASE_VIEW.h);
  view.x = Math.max(BASE_VIEW.x,
           Math.min(BASE_VIEW.x + BASE_VIEW.w - view.w, view.x));
  view.y = Math.max(BASE_VIEW.y,
           Math.min(BASE_VIEW.y + BASE_VIEW.h - view.h, view.y));
}
function applyView() {
  clampView();
  const el = document.getElementById('svg');
  if (el) el.setAttribute('viewBox', `${view.x} ${view.y} ${view.w} ${view.h}`);
}
function zoomAt(factor, fx, fy) {
  // Keep the point under the cursor fixed, which is what makes wheel zoom feel
  // like moving the paper rather than moving the camera.
  const w = Math.min(BASE_VIEW.w, Math.max(BASE_VIEW.w * 0.25, view.w * factor));
  const k = w / view.w;
  view = {w, h: view.h * k,
          x: fx - (fx - view.x) * k,
          y: fy - (fy - view.y) * k};
  applyView();
}
function zoomBy(f) { zoomAt(f, view.x + view.w / 2, view.y + view.h / 2); }
function zoomFit() { view = {...BASE_VIEW}; applyView(); }

function clearGhost() {
  const fx = document.getElementById('lay-fx');
  if (fx) fx.innerHTML = '';
  const pv = document.getElementById('preview');
  if (pv) pv.className = '';
}

// Draw what would happen if you clicked here, at 40% opacity, with the exact
// cost. This kills the "simulate it in my head, click, regret" loop, which is
// most of what makes a 54-option turn hard to read.
function showGhost(act, id) {
  if (!S || card === null || kind === null) return;
  const ms = (S.moves || []).filter(m => sigAt(m.card) === sigAt(card)
      && m.kind === kind
      && (act === 'town'
          ? (m.town === id || (m.sales || []).some(sa => sa.town === id))
          : (m.lines || []).includes(id)));
  if (!ms.length) return;
  const C = S.coords, col = COL[S.seat];
  let g = '';
  if (act === 'town') {
    const t = (S.towns || []).find(x => x.id === id);
    if (t) {
      const [x, y] = C[id], n = t.slots.length, w = 32, total = n * w;
      for (const m of ms) {
        if (m.slot === undefined || m.slot === null) continue;
        const sx = x - total/2 + m.slot*w, bw = w - 4;
        g += `<rect x="${sx}" y="${y-13}" width="${bw}" height="27" rx="5"
               fill="${col}" fill-opacity="0.40" stroke="${col}" stroke-width="1.5"/>`;
        if (m.industry)
          g += icon(m.industry, sx + bw/2 - 8, y - 10, 17, 'var(--onaccent)', 0.85);
      }
    }
  } else {
    const l = (S.all_links || []).find(x => x.id === id);
    if (l) {
      const cx = l.ends.reduce((a,e)=>a+C[e][0],0)/l.ends.length;
      const cy = l.ends.reduce((a,e)=>a+C[e][1],0)/l.ends.length;
      g += l.ends.map(e => `<line x1="${C[e][0]}" y1="${C[e][1]}"
            x2="${cx}" y2="${cy}" stroke="${col}" stroke-opacity="0.55"
            stroke-width="6" stroke-linecap="round"/>`).join('');
    }
  }
  document.getElementById('lay-fx').innerHTML = g;
  const m = ms[0], pv = document.getElementById('preview');
  pv.innerHTML = `<b>${(m.pretty || m.text).replace(/ · card.*$/, '')}</b>`
    + (ms.length > 1 ? ` <span class="meta">· ${ms.length} options here</span>` : '')
    + (m.price !== undefined ? '<br>' + costLine(m, S) : '');
  pv.className = 'on';
}
function undo() { card = null; kind = null; post('/api/undo', {}); }
// Restart and End cannot be undone and are not part of the game, so each
// takes two clicks -- the button states what it will do rather than a dialog
// interrupting the board. Arming clears after a few seconds.
let armed = null, armTimer = null;
function arm(what) {
  if (armed === what) {
    armed = null; clearTimeout(armTimer);
    if (what === 'restart') { resultsHidden = false; post('/api/new', {}); }
    else if (what === 'stop') post('/api/shutdown', {});
    else post('/api/end', {});
    return;
  }
  armed = what;
  clearTimeout(armTimer);
  armTimer = setTimeout(() => { armed = null; draw(S); }, 4000);
  draw(S);
}

function doExport() {
  const note = document.getElementById('exported');
  note.textContent = 'writing…';
  fetch('/api/export', {method:'POST', headers:{'Content-Type':'application/json'},
                        body: JSON.stringify({room: ROOM})})
    .then(r => r.json())
    .then(s => { draw(s);
      note.textContent = s.exported ? '→ ' + s.exported.split('/').pop() : 'failed'; });
}
function pickKind(k) {
  kind = (kind === k ? null : k); focus = null; bind = null;
  dev1 = dev2 = null; sc1 = sc2 = null;
  draw(S);
}
function play(i) {
  document.getElementById('details').innerHTML = '<p class="empty">Playing…</p>';
  card = null; kind = null; focus = null;
  post('/api/move', {index: i});
}
fetch('/api/state?room=' + encodeURIComponent(ROOM))
  .then(r => r.json()).then(draw);
</script>
